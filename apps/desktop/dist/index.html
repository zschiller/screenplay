<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenplay</title>
    <!--
      The window's first paint, shown while the shell boots the sidecar; the
      shell then navigates this webview to the local server. It follows the
      app's own theme tokens (packages/ui globals.css) and the system light/dark
      setting, so the hand-off to the app is a content change, not a flash. Only
      the spinner shows: the homepage hero's liquid dither, stirred in a circle
      from still water (launch/spinner.ts, built into dist/launch by
      scripts/build-launch.mjs).
    -->
    <style>
      :root {
        color-scheme: light dark;
        --background: oklch(1 0 0);
        --foreground: oklch(0 0 0);
        --muted-foreground: oklch(0.556 0 0);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0 0 0);
          --foreground: oklch(1 0 0);
          --muted-foreground: oklch(0.708 0 0);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      /* The window uses an overlay title bar, so this page must supply the drag
         region itself or the window can't be moved until the app loads. */
      .titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 52px;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 24px;
        text-align: center;
      }
      /* The spinner's canvas has a pixel per grain, scaled up without
         smoothing; spinner.js sizes both. Its water fades out well before the
         edge, so the box itself never shows. */
      .stage {
        width: 560px;
        height: 560px;
      }
      .stage canvas {
        display: block;
        image-rendering: pixelated;
      }
      .error {
        display: none;
        max-width: 360px;
        flex-direction: column;
        gap: 4px;
      }
      .error h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
      }
      .error p {
        margin: 0;
        font-size: 13px;
        color: var(--muted-foreground);
        -webkit-user-select: text;
        user-select: text;
      }
      body.failed .stage {
        display: none;
      }
      body.failed .error {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>
    <main class="wrap">
      <div class="stage" role="status" aria-label="Starting Screenplay">
        <canvas aria-hidden="true"></canvas>
      </div>
      <div class="error" role="alert">
        <h1>Screenplay couldn’t start</h1>
        <p>Quit and reopen the app to try again.</p>
      </div>
    </main>
    <script type="module" src="launch/spinner.js"></script>
    <script>
      // Called by the shell (main.rs `boot`) when the sidecar fails to start.
      // The cause goes to the shell's log, not here: it's for us, not the user.
      window.showBootError = () => document.body.classList.add("failed")
    </script>
  </body>
</html>
