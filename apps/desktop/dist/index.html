<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenplay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #ededed;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #333;
        border-top-color: #ededed;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .muted {
        color: #888;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!-- Shown only while the shell waits for the sidecar's /api/health to go
         green; the shell then navigates this webview to the local server. -->
    <div class="wrap">
      <div class="spinner"></div>
      <div class="muted">Starting Screenplay…</div>
    </div>
  </body>
</html>
