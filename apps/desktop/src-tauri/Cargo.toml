[package]
name = "screenplay-desktop"
version = "0.0.1"
description = "Screenplay desktop shell"
edition = "2021"
rust-version = "1.77"

# Name the binary "Screenplay" so it matches `mainBinaryName`/`productName`. In
# `tauri dev` there's no `.app` bundle, so macOS labels the Dock tile with the
# raw executable name — without this the Dock reads "screenplay-desktop".
[[bin]]
name = "Screenplay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2" # native directory dialog for the add-Repo local-folder flow (#428)
tauri-plugin-opener = "2" # open external (PR/GitHub) links in the system browser — window.open no-ops in the webview
tauri-plugin-window-state = "2" # persist + restore the main window's size/position across launches
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sidecar lifecycle helpers:
ureq = "2"          # blocking HTTP client for the /api/health probe
url = "2"           # parse the sidecar URL passed to webview.navigate()
flate2 = "1"        # decompress the bundled sidecar.tar.gz
tar = "0.4"         # unpack it (restores the pnpm symlinks Tauri's copy drops)
tiny_http = "0.12"  # the localhost control server the thumbnail capturer calls
getrandom = "0.2"   # CSPRNG for the per-install secrets provisioned on first launch

# macOS thumbnail capture: drive the underlying WKWebView's takeSnapshot via raw
# objc messaging. Pinned to the objc2/block2 versions wry already resolves so
# there's a single objc runtime ABI in the binary.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
