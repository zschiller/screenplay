name: CI

# Runs the workspace test suite, typecheck, lint and a format check on every
# push and pull request. This is the gate that the manual publish workflows
# and Vercel deploys don't provide — Vercel only runs `next build`, so without this a
# broken test could merge and ship unnoticed.
#
# The jobs run side by side: typecheck, lint, format, the app's unit tests in
# three shards, and the browser tests (`*.browser.test.ts`, a real Chrome, Xvfb
# and ffmpeg) on a runner of their own so they aren't starved by the rest.
# `test` is the one check that says whether all of them passed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Turbo's local cache lets unchanged packages skip typecheck/test entirely.
      # A fresh checkout starts empty, so persist `.turbo` across runs: key per
      # job and commit, restore the newest prior cache via the prefix fallback
      # (each run then saves a fresh superset).
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-

      # `incremental: true` makes each `tsc --noEmit` write a
      # `tsconfig.tsbuildinfo` next to its config. Restoring these lets a package
      # that Turbo can't skip (something in it changed) re-check only the changed
      # files — apps/app drops from ~14s to ~4s — instead of a full cold check.
      # Gitignored, so they never enter Turbo's input hash.
      - name: Cache tsc buildinfo
        uses: actions/cache@v4
        with:
          path: |
            apps/*/tsconfig.tsbuildinfo
            packages/*/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      # Every package's tests but the app's, which the jobs below run.
      - name: Test packages
        run: pnpm turbo run test --filter='!app'

  # The repo's ESLint rules (the sparkle icon ban, React hooks rules) only
  # hold if something runs them. An error fails the job; warnings don't.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lint-

      - name: Lint
        run: pnpm lint

  # Prettier over all TypeScript in apps/ and packages/. To fix what it lists,
  # run `pnpm exec prettier --write` on those files.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Per shard: Turbo hashes the shard argument, so each shard's cache
      # entry is its own.
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-unit-${{ matrix.shard }}-

      - name: Test
        run: >-
          pnpm turbo run test --filter=app --
          --shard=${{ matrix.shard }}/3 --exclude='**/*.browser.test.*'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The browser tests run a real Xvfb, Chrome, ffmpeg and xte, as a
      # Workspace Sandbox does (#1392). The runner ships Chrome and Xvfb;
      # browser-stack.sh adds the rest. It doesn't need the workspace, so it
      # starts here in the background, alongside Setup, and "Wait for the
      # browser stack" below holds the tests until it's done. Its packages
      # are cached per runner image, so most runs install them with no
      # network: an apt mirror that stalled used to hold the job until the
      # wait timed out.
      - name: Read the runner image
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache the browser stack's packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/browser-debs
          key: browser-debs-${{ steps.image.outputs.version }}-${{ hashFiles('.github/scripts/browser-stack.sh') }}

      - name: Start the browser stack
        run: |
          nohup bash -c '
            .github/scripts/browser-stack.sh "$RUNNER_TEMP/browser-debs"
            echo $? > "$RUNNER_TEMP/install.tmp" && mv "$RUNNER_TEMP/install.tmp" "$RUNNER_TEMP/install.status"
          ' > "$RUNNER_TEMP/install.log" 2>&1 &

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-browser-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-browser-

      # Follows the install's log as it runs, so a stall shows where, and
      # fails if the install did.
      - name: Wait for the browser stack
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP"
          tail -n +1 -f install.log & tail=$!
          until [ -f install.status ]; do sleep 1; done
          sleep 1; kill $tail
          [ "$(cat install.status)" = 0 ] || { echo "::error::Installing the browser stack failed"; exit 1; }

      # A runner's first Chrome launch reads its install from a cold disk and
      # can take over 20s, which the tests' first frame would otherwise pay
      # for. Launch it once here, last thing before the tests: once it moved
      # into the background next to the install and Setup, the Mac backend's
      # hover tests started failing. The time it took is in the log.
      - name: Warm up Chrome
        run: time google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null

      # Required: a missing piece of the stack fails the job rather than
      # skipping the tests.
      - name: Test
        run: pnpm turbo run test --filter=app -- browser.test
        env:
          SCREENPLAY_REQUIRE_BROWSER_STACK: "1"

  # The one check to require: green only when every job above is.
  test:
    if: always()
    needs: [typecheck, lint, format, unit, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
