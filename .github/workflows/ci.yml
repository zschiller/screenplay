name: CI

# Runs the workspace test suite and typecheck on every push and pull
# request. This is the gate that the manual publish workflows and Vercel
# deploys don't provide — Vercel only runs `next build`, so without this a
# broken test could merge and ship unnoticed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: the local sandbox provider's copyPatterns uses fs.glob (#441),
          # which Node 20 doesn't have.
          node-version: 22
          cache: pnpm

      # `setup-node` caches the pnpm store but NOT puppeteer's browser download
      # (~/.cache/puppeteer). Without this, `puppeteer`'s postinstall re-fetches
      # ~600 MB of Chromium on every run. Keyed on the lockfile so a puppeteer
      # version bump busts it.
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo's local cache lets unchanged packages skip typecheck/test entirely.
      # A fresh checkout starts empty, so persist `.turbo` across runs: key per
      # commit, restore the newest prior cache via the prefix fallback (each run
      # then saves a fresh superset).
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `incremental: true` makes each `tsc --noEmit` write a
      # `tsconfig.tsbuildinfo` next to its config. Restoring these lets a package
      # that Turbo can't skip (something in it changed) re-check only the changed
      # files — apps/app drops from ~14s to ~4s — instead of a full cold check.
      # Gitignored, so they never enter Turbo's input hash.
      - name: Cache tsc buildinfo
        uses: actions/cache@v4
        with:
          path: |
            apps/*/tsconfig.tsbuildinfo
            packages/*/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
