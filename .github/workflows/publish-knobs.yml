name: Publish @screenplay.space/knobs

# Manual release for the knobs runtime package. Pick a bump in the GitHub
# Actions UI — the workflow updates `packages/screenplay-knobs/package.json`,
# commits + tags the bump, and publishes to npm with provenance.
#
# One-time setup:
#  1. Create an "Automation" granular access token at npmjs.com scoped to the
#     @screenplay.space org with publish access to @screenplay.space/knobs.
#  2. Add it to this repo as a secret named `NPM_TOKEN`.
#  3. (Optional) Settings → Actions → General → Workflow permissions:
#     enable "Read and write permissions" so the bump commit can push.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump keyword (patch | minor | major | prerelease) or an explicit semver like 0.1.0. Use 'none' to publish the version already in package.json (e.g. for the first publish)."
        required: true
        default: "patch"
        type: string
      tag:
        description: "npm dist-tag to publish under"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next
          - beta

permissions:
  contents: write       # for the bump commit + tag push
  id-token: write       # for npm provenance attestation

concurrency:
  group: publish-knobs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so the bump commit pushes cleanly.
          fetch-depth: 0
          # Use the workflow's own token so the bump commit + tag push are
          # authorized; falls back to GITHUB_TOKEN by default.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @screenplay.space/knobs typecheck

      - name: Configure git identity
        run: |
          git config user.name  "screenplay-release[bot]"
          git config user.email "screenplay-release[bot]@users.noreply.github.com"

      - name: Resolve target version
        id: bump
        working-directory: packages/screenplay-knobs
        run: |
          if [ "${{ inputs.bump }}" = "none" ]; then
            # Publish the version already on disk — first publishes, or
            # when the version was bumped in a separate PR.
            NEW_VERSION=$(node -p "require('./package.json').version")
          else
            # `npm version` accepts patch|minor|major|prerelease *and* an
            # explicit semver string, so a single call covers both forms.
            # --no-git-tag-version skips npm's own tag — we tag manually
            # below using the package-name-prefixed format.
            NEW_VERSION=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
            NEW_VERSION="${NEW_VERSION#v}"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=screenplay-knobs-v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit + tag bump
        if: inputs.bump != 'none'
        run: |
          git add packages/screenplay-knobs/package.json
          git commit -m "Release @screenplay.space/knobs ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Tag existing version
        if: inputs.bump == 'none'
        run: |
          # No bump commit, but still drop a release tag pointing at the
          # commit that's being published.
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Publish to npm
        working-directory: packages/screenplay-knobs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # --no-git-checks: pnpm refuses to publish from a non-clean tree by
          #   default; the bump commit already landed, but pnpm still sees the
          #   updated package.json as "dirty" relative to HEAD before refresh.
          # --provenance: emits a sigstore attestation tying this publish to
          #   this exact workflow run + commit. Requires id-token: write above.
          pnpm publish \
            --access public \
            --tag "${{ inputs.tag }}" \
            --no-git-checks \
            --provenance

      - name: Summary
        run: |
          {
            echo "### Published @screenplay.space/knobs"
            echo ""
            echo "- **Version**: \`${{ steps.bump.outputs.version }}\`"
            echo "- **dist-tag**: \`${{ inputs.tag }}\`"
            echo "- **Tag**: \`${{ steps.bump.outputs.tag }}\`"
            echo "- **npm**: https://www.npmjs.com/package/@screenplay.space/knobs/v/${{ steps.bump.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
