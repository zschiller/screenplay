name: Vercel Sandbox image

# Builds the image hosted Workspace Sandboxes boot from (apps/app/vercel-sandbox-image)
# and pushes it to the app project's Vercel Container Registry as
# `screenplay-workspace`, which the app creates Sandboxes from by default
# (`VERCEL_SANDBOX_IMAGE`). Rebuilt weekly so the base image's and Chrome's security
# updates reach new Sandboxes.
#
# Signs in to VCR with GitHub OIDC, so no secret is stored. Needs a Vercel OIDC
# policy for this repository and workflow, and three repository variables:
# VERCEL_TEAM_ID, VERCEL_TEAM_SLUG and SCREENPLAY_APP_VERCEL_PROJECT_SLUG (the
# app project, named for the app because the repo holds several Vercel projects).
# Until they're set, the job is skipped.

on:
  push:
    branches: [main]
    paths:
      - "apps/app/vercel-sandbox-image/**"
      - ".github/workflows/vercel-sandbox-image.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: vercel-sandbox-image
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  push:
    if: vars.VERCEL_TEAM_ID != ''
    runs-on: ubuntu-latest
    env:
      REPOSITORY: vcr.vercel.com/${{ vars.VERCEL_TEAM_SLUG }}/${{ vars.SCREENPLAY_APP_VERCEL_PROJECT_SLUG }}/screenplay-workspace
    steps:
      - name: Check the repository variables
        if: vars.VERCEL_TEAM_SLUG == '' || vars.SCREENPLAY_APP_VERCEL_PROJECT_SLUG == ''
        run: |
          echo "::error::Set the repository variables VERCEL_TEAM_SLUG and SCREENPLAY_APP_VERCEL_PROJECT_SLUG (Settings > Secrets and variables > Actions > Variables)."
          exit 1

      - uses: actions/checkout@v4

      # Vercel's managed base image can't be pulled outside a Sandbox, so build
      # it from the Dockerfiles Vercel publishes it from.
      - uses: actions/checkout@v4
        with:
          repository: vercel/sandbox
          path: vercel-sandbox
          sparse-checkout: images

      - uses: docker/setup-buildx-action@v3

      - name: Log in to VCR
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      - name: Build and push
        run: docker buildx bake -f apps/app/vercel-sandbox-image/docker-bake.hcl workspace
        env:
          VERCEL_BASE_DOCKERFILES: vercel-sandbox/images
          TAGS: ${{ env.REPOSITORY }}:latest ${{ env.REPOSITORY }}:${{ github.sha }}
          PUSH: "true"
