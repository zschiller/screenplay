<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Live tag and control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: phone first, one column. Question, then tabs (open round / Today / Earlier rounds). Each question is a deck of cards (Today, A, B…) swiped one at a time on a phone and side by side on wide screens. A bar pinned to the bottom carries the picks, a note and Copy. Swap the tokens below for the repo's brand; the defaults are neutral. */
:root{--bg:#fbfbfa;--surface:#f3f3f1;--line:#e2e2df;--fg:#161615;--muted:#5d5d59;--accent:#c41fa8;--ok:#1f7a45;--no:#a3372b;
--sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Unbounded",ui-sans-serif,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--stick:0px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#ff4fd8;--ok:#5fd08e;--no:#f08a7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#ff4fd8;--ok:#5fd08e;--no:#f08a7c;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
@media (min-width:720px){.wrap{padding-inline:24px;padding-top:40px;gap:32px}}
.lbl{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.lbl.acc{color:var(--accent)}
h1{font:600 clamp(22px,5.4vw,32px)/1.18 var(--head);letter-spacing:-.015em;margin:8px 0 10px;text-wrap:balance}
h2{font:600 clamp(17px,4.4vw,21px)/1.28 var(--head);margin:0;text-wrap:balance}
h3{font:500 16px/1.35 var(--sans);margin:0}
p{margin:0;max-width:72ch}
a{color:var(--accent)}
code{font:13px var(--mono)}
.muted{color:var(--muted)}
blockquote{margin:0;padding-left:12px;border-left:2px solid var(--line);color:var(--muted);max-width:68ch}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
button{font:500 13px/1.2 var(--sans);border-radius:8px;padding:8px 12px;min-height:36px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.shead{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--fg)}
ul.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:80ch;font-size:14px}
/* Tabs: the open round, Today, earlier rounds */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
@media (min-width:720px){.tabs{margin-inline:-24px;padding-inline:24px}}
.tabs button{border-color:transparent;background:transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
/* Folded blocks: In every option, each earlier round */
details.fold{border:1px solid var(--line);border-radius:10px}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"Show";grid-row:1/span 2;grid-column:2;font:500 13px var(--sans);color:var(--muted)}
details.fold[open]>summary::after{content:"Hide"}
details.fold>summary .sum{font-size:14px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
details.fold[open]>summary .sum{display:none}
details.fold>.body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.ledger{display:flex;flex-direction:column;gap:8px}
/* A question and its options */
.question{display:flex;flex-direction:column;gap:12px;min-width:0}
.question+.question{margin-top:20px}
.qhead{display:flex;flex-direction:column;gap:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}
.opt{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.letter{font:600 14px var(--mono);color:var(--accent)}
.opt.today .letter{color:var(--muted)}
.badge{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.badge.rec{color:var(--accent);border-color:currentColor}
.badge.picked{color:var(--ok);border-color:currentColor}
.badge.rejected{color:var(--no);border-color:currentColor}
.opt.rejected .shots{opacity:.55}
.cost{font-size:14px;color:var(--muted)}
.cost b{font-weight:500;color:var(--fg)}
.choose{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.choose button{min-width:112px}
.choose button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.choose button[aria-pressed="true"]::before{content:"✓ "}
/* Deck: chips pinned under the tabs; the track swipes one card at a time on a phone and becomes a grid on wide screens */
.chips{position:sticky;top:var(--stick);z-index:4;background:var(--bg);display:flex;gap:6px;padding-block:8px;margin-top:-8px;overflow-x:auto;scrollbar-width:none}
.chips button{min-width:44px;padding-inline:12px;font-family:var(--mono)}
.chips button[aria-current="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.chips button::after{content:" ✓";color:var(--ok);visibility:hidden}
.chips button.chosen::after{visibility:visible}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;align-items:start}
.track::-webkit-scrollbar,.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.track>.opt{scroll-snap-align:start;scroll-snap-stop:always}
@media (min-width:900px){.chips{display:none}.track{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));overflow:visible;gap:20px}}
/* Captures: the viewer's theme only, tap to enlarge */
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:0;background:var(--surface);cursor:zoom-in;min-height:0}
.shot img{display:block;width:100%;height:auto}
.dk{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dk{display:block!important}:root:not([data-theme="light"]) .has-dk .lt{display:none!important}}
:root[data-theme="dark"] .dk{display:block!important}:root[data-theme="dark"] .has-dk .lt{display:none!important}
figcaption{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dialog.lb{padding:0;border:0;background:transparent;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh}
dialog.lb::backdrop{background:rgb(0 0 0/.86)}
dialog.lb .in{width:100%;height:100%;overflow:auto;display:grid;place-items:center;padding:16px;cursor:zoom-out}
dialog.lb img{max-width:none;background:var(--surface)}
@media (min-width:720px){dialog.lb img{max-width:100%}}
/* Bottom bar: picks so far, a note, Copy */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.bar{padding-inline:24px}}
.bar .in{max-width:1032px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar .row{display:flex;align-items:center;gap:8px}
.bar .picks{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar .picks b{color:var(--fg);font-weight:500}
.bar textarea{width:100%;font:15px/1.45 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:72px}
#copy{min-width:132px}
.bar #out{font:12.5px/1.5 var(--mono)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>
const IMG=(p,cap,dk)=>({p,cap,dk}); // p: light (or only) capture, dk: optional dark capture
const S=(o)=>[IMG(`r1/${o}-live-light.png`,`${o==="today"?"Today":o} · Live, nobody has control`,`r1/${o}-live-dark.png`),IMG(`r1/${o}-control-light.png`,`${o==="today"?"Today":o} · Ana has control`,`r1/${o}-control-dark.png`)];
const PAGE={
 date:"3 Oct 2026",
 slug:"live-tag-control",
 quote:"i feel like the live facepile thing is weird now that everyone on the canvas is in live automatically. it also feels inconsistent w/ the control interaction pill. can we resolve that",
 q:"What should a live frame's title line show, and how should it sit with the control tag?"
};
const TODAY={facts:[
 "Selected frame, nobody in control: eight 8px handles on the pink selection ring, background fill, 1px pink outline, drawn on the selection overlay (<code>selection-overlay.tsx:329</code>).",
 "Selected frame while Ana has control: the pink ring stays, the handles are gone (<code>canvas.tsx:2419</code>, <code>live-page.tsx:526</code>), and the title line says “Ana has control”.",
 "Nobody else can resize while one person has control; the person in control can't either while they interact."
],shots:[IMG("r2/idle-light.png","Today · selected, nobody in control","r2/idle-dark.png"),IMG("r2/today-light.png","Today · selected, Ana has control","r2/today-dark.png")]};
const ROUNDS=[
{n:3,feedback:"Zack on round 2: “the gray handles are not noticeable enough i think, they look almost the same. what about lower opacity? idk”",every:[
 "Selected frame while Ana has control; the handles don't resize and the cursor stays the arrow.",
 "The pink selection ring, the “Ana has control” pill and the Interact button are unchanged unless an option says so.",
 "Mockups get the same."
],questions:[
 {key:"faded",title:"",intro:"Compare each against Today's normal handles (first card).",options:[
  {id:"A",name:"Faded handles",why:"Today's pink handles with their outline at 40% opacity; the fill stays solid so the ring doesn't show through. Your idea: same shape and spot, visibly switched off.",cost:"A faded state is new to the canvas (the Signal palette avoids tints elsewhere).",rec:true,state:"picked",shots:[IMG("r3/F-light.png","A · Ana has control","r3/F-dark.png")]},
  {id:"B",name:"Dot markers",why:"The handles become 5px solid pink dots in the same eight spots: they mark the selection's corners and edges but no longer look like square grips.",cost:"A second handle shape to learn, and dots are small at a glance.",state:"rejected",shots:[IMG("r3/D-light.png","B · Ana has control","r3/D-dark.png")]},
  {id:"C",name:"Faded + dashed ring",why:"A's faded handles, and the selection ring turns dashed while someone else has control, so the whole frame reads as locked, not just its corners.",cost:"Changes the ring too, which also shows when you don't look at the handles. Dashes are drawn per frame size.",state:"rejected",shots:[IMG("r3/R-light.png","C · Ana has control","r3/R-dark.png")]}
 ]}
]},
{n:2,feedback:"Zack (round 1 picked B, building in PR #1580): “can we show the handles but disable them so its still clear what is selected? can we do some design on what that might look like”",every:[
 "The handles stay in their eight spots on the pink selection ring while someone else has control, and dragging them does nothing.",
 "The cursor over them stays the arrow, not a resize cursor.",
 "The “Ana has control” pill, the ring and the Interact button are unchanged.",
 "Mockups get the same."
],questions:[
 {key:"handles",title:"",intro:"Selected frame while Ana has control.",options:[
  {id:"A",name:"Grey handles",why:"Same squares with a muted grey outline instead of pink. Greyed-out is how every tool says “disabled”, and the pink ring still says the frame is selected.",cost:"None beyond the new handle colour.",rec:true,state:"rejected",shots:[IMG("r2/A-light.png","A · Ana has control","r2/A-dark.png")]},
  {id:"B",name:"Controller's colour",why:"The handles take Ana's cursor colour, matching her pill, so they say who holds the frame right now.",cost:"Pale cursor colours nearly vanish on the light canvas, and the agent's would be ink. Reads more like Ana's selection than a lock.",state:"rejected",shots:[IMG("r2/B-light.png","B · Ana has control","r2/B-dark.png")]},
  {id:"C",name:"Unchanged handles",why:"Today's pink handles stay as they are; they just don't resize, and hovering one shows a not-allowed cursor.",cost:"Looks resizable until you try, which is the confusion disabled controls avoid.",state:"rejected",shots:[IMG("r2/C-light.png","C · Ana has control","r2/C-dark.png")]}
 ]}
]},
{n:1,feedback:"",every:[
 "The faces leave the title line. Live now means everyone on the canvas, so the header's avatars already say who is watching.",
 "The Go live toggle, the Interact button and its driver face stay as they are.",
 "Each option shows two moments: live with nobody in control, then Ana taking control.",
 "Mockups get whatever frames get (PR #1570).",
 "The control shots are mocked into the live state, so they still show resize handles; the real frame hides them while someone else has control."
],questions:[
 {key:"tag",title:"",intro:"",options:[
  {id:"A",name:"Just “Live”",why:"Keep today's muted “Live” and drop the faces, 22px wide. The smallest change: it fixes the facepile and leaves everything else alone.",cost:"Live and control still differ in form, muted text against a filled pill, so the inconsistency stays.",state:"rejected",shots:S("A")},
  {id:"B",name:"Live pill",why:"“Live” becomes an outlined pill, the Go live toggle's broadcast icon plus the word, in the control tag's exact shape: 18px tall, 4px radius, 6px padding, 12px medium. Control swaps in on the same spot in its cursor colour. Same family, live quiet and control loud.",cost:"A 1px outline on the title line, a little heavier than today's muted text. The quiet secondary fill was tried first and vanished on the light canvas. 50.7px wide.",rec:true,state:"picked",shots:S("B")},
  {id:"C",name:"One pill",why:"B, and the broadcast icon also stays inside the control pill, so taking control reads as a state of the live frame rather than a different tag.",cost:"Control without live (the agent on the Mac, or on an own copy) would need a second control pill without the icon. Control pill grows to 114.7px.",state:"rejected",shots:S("C")},
  {id:"D",name:"Both quiet",why:"Make control match Live instead: muted “Ana has control” with her 16px face, in the title's type, no fill.",cost:"Reverses the coloured driver tag picked in the control exploration (#1376), so a frame someone controls no longer reads from across the canvas.",state:"rejected",shots:S("D")}
 ]}
]}
];

(()=>{
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const latest=ROUNDS[0],past=ROUNDS.slice(1);
const SIGN=[["ok","Looks good"],["changes","Needs changes"]];
const signoff=q=>q.options.length===1;
const KEY="exploration-"+PAGE.slug;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const state=saved.round===latest.n?{picks:saved.picks||{},note:saved.note||""}:{picks:{},note:""};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({round:latest.n,...state}))}catch(e){}};

const shots=list=>list&&list.length?`<div class="shots">`+list.map(i=>`<figure><button type="button" class="shot${i.dk?" has-dk":""}" data-lt="${esc(i.p)}" data-dk="${esc(i.dk||"")}" aria-label="Enlarge ${esc(i.cap)}"><img class="lt" src="${esc(i.p)}" alt="${esc(i.cap)}" loading="lazy">${i.dk?`<img class="dk" src="${esc(i.dk)}" alt="" aria-hidden="true" loading="lazy">`:""}</button><figcaption>${esc(i.cap)}</figcaption></figure>`).join("")+`</div>`:"";
const badges=o=>(o.rec?'<span class="badge rec">Recommended</span>':"")+(o.state?`<span class="badge ${o.state}">${o.state==="picked"?"Picked":"Rejected"}</span>`:"");
const choose=(q,o)=>`<div class="choose">`+(signoff(q)?SIGN:[[o.id,"Pick "+o.id]]).map(([v,l])=>`<button type="button" data-q="${esc(q.key)}" data-v="${esc(v)}" data-label="${esc(l)}">${esc(l)}</button>`).join("")+`</div>`;
const card=(q,o,live)=>`<article class="opt ${o.state||""}" data-id="${esc(o.id)}"><header><span class="letter">${esc(o.id)}</span><h3>${esc(o.name)}</h3>${badges(o)}</header>${o.html||""}${shots(o.shots)}${o.why?`<p>${o.why}</p>`:""}${o.cost?`<p class="cost"><b>Cost</b> ${o.cost}</p>`:""}${live?choose(q,o):""}</article>`;
const hasToday=TODAY.compare!==false&&((TODAY.shots&&TODAY.shots.length)||TODAY.html);
const todayCard=`<article class="opt today" data-id="Today"><header><span class="letter">Today</span><h3>What main does now</h3></header>${TODAY.html||""}${shots(TODAY.shots)}</article>`;
function question(r,q,i,live){
 const n=r.questions.length;
 const head=(q.title||n>1)?`<div class="qhead">${n>1?`<p class="lbl acc">Question ${i+1} of ${n}</p>`:""}${q.title?`<h2>${esc(q.title)}</h2>`:""}${q.intro?`<p class="muted">${q.intro}</p>`:""}</div>`:"";
 if(!live)return `<div class="question">${head}<div class="opts">${q.options.map(o=>card(q,o,false)).join("")}</div></div>`;
 const ids=(hasToday?["Today"]:[]).concat(q.options.map(o=>o.id));
 return `<div class="question" data-q="${esc(q.key)}">${head}<div class="chips" aria-label="Options">`+ids.map(id=>`<button type="button" data-go="${esc(id)}">${esc(id)}</button>`).join("")+`</div><div class="track">${hasToday?todayCard:""}${q.options.map(o=>card(q,o,true)).join("")}</div></div>`;
}
const fold=(title,sum,body,open)=>`<details class="fold"${open?" open":""}><summary><span class="lbl">${title}</span><span class="sum">${esc(sum)}</span></summary><div class="body">${body}</div></details>`;
const list=items=>`<ul class="facts">${[].concat(items).map(x=>`<li>${x}</li>`).join("")}</ul>`;
const outcome=r=>{const p=r.questions.flatMap(q=>q.options.filter(o=>o.state==="picked").map(o=>signoff(q)?`Signed off ${o.name}`:`${o.id}: ${o.name}`));return p.length?p.join(" · "):"No pick"};
const Q=latest.questions;
const openTitle=Q.length>1?`${Q.length} questions`:signoff(Q[0])?"Sign off":`${Q[0].options.length} options`;

document.body.insertAdjacentHTML("afterbegin",`<div class="wrap">
<header><div class="top"><p class="lbl acc">Design exploration · ${esc(PAGE.date)}</p><button type="button" class="ghost" id="theme">Dark</button></div><h1>${esc(PAGE.q)}</h1><blockquote>${esc(PAGE.quote)}</blockquote></header>
<nav class="tabs" aria-label="Sections"><button type="button" data-tab="now" aria-selected="true">Round ${latest.n}</button><button type="button" data-tab="today" aria-selected="false">Today</button>${past.length?`<button type="button" data-tab="past" aria-selected="false">Earlier rounds · ${past.length}</button>`:""}</nav>
<section data-panel="now"><div class="shead"><p class="lbl acc">Round ${latest.n} · open</p><h2>${openTitle}</h2></div>${latest.feedback?`<blockquote>${latest.feedback}</blockquote>`:""}${latest.every?fold("In every option",latest.every[0].replace(/<[^>]+>/g,""),list(latest.every),ROUNDS.length===1):""}${Q.map((q,i)=>question(latest,q,i,true)).join("")}</section>
<section data-panel="today" hidden><div class="shead"><p class="lbl">Today</p><h2>What main does now</h2></div>${TODAY.facts?list(TODAY.facts):""}${TODAY.html||""}${shots(TODAY.shots)}</section>
${past.length?`<section data-panel="past" hidden><div class="shead"><p class="lbl">Earlier rounds</p><h2>Newest first</h2></div><div class="ledger">${past.map(r=>fold(`Round ${r.n}`,outcome(r),(r.feedback?`<blockquote>${r.feedback}</blockquote>`:"")+(r.every?list(r.every):"")+r.questions.map((q,i)=>question(r,q,i,false)).join(""))).join("")}</div></section>`:""}
</div>
<div class="bar"><div class="in"><textarea id="note" aria-label="Note" placeholder="Anything to add" hidden></textarea><textarea id="out" aria-label="Reaction to copy" readonly hidden></textarea><div class="row"><div class="picks" id="picks" role="status" aria-live="polite"></div><button type="button" id="noteBtn">Note</button><button type="button" class="primary" id="copy">Copy reaction</button></div></div></div>
<dialog class="lb" id="lb"><div class="in"><img alt=""></div></dialog>`);
document.documentElement.style.setProperty("--stick",`calc(env(safe-area-inset-top,0px) + ${document.querySelector(".tabs").offsetHeight}px)`);

const answer=q=>{const v=state.picks[q.key];return !v?"":signoff(q)?SIGN.find(s=>s[0]===v)[1]:`${v}: ${q.options.find(o=>o.id===v).name}`};
function build(){
 const lines=Q.map(q=>{const a=answer(q),name=signoff(q)?q.options[0].name:q.title;return "→ "+(name?name+": ":"")+(a||"No pick yet")});
 return [`Exploration: ${PAGE.q}`,`Round ${latest.n}`,...lines].concat(state.note.trim()?[`Note: ${state.note.trim()}`]:[]).join("\n");
}
function sync(){
 const done=Q.filter(q=>state.picks[q.key]);
 $("picks").innerHTML=done.length?done.map(q=>`<b>${esc(Q.length>1?answer(q).split(":")[0]:answer(q))}</b>`).join(" · ")+(Q.length>1?` · ${done.length} of ${Q.length} answered`:""):Q.length>1?`0 of ${Q.length} answered`:signoff(Q[0])?"Sign off or say what to change":"No pick yet";
 document.querySelectorAll(".choose button").forEach(b=>{const on=state.picks[b.dataset.q]===b.dataset.v;b.setAttribute("aria-pressed",on);if(b.dataset.label.startsWith("Pick "))b.textContent=on?"Picked":b.dataset.label});
 document.querySelectorAll(".question[data-q]").forEach(el=>el.querySelectorAll(".chips button").forEach(c=>{const q=Q.find(x=>x.key===el.dataset.q),v=state.picks[el.dataset.q];c.classList.toggle("chosen",!!v&&(v===c.dataset.go||signoff(q)&&c.dataset.go!=="Today"))}));
 save();
}
const openNote=()=>{const n=$("note");n.hidden=false;n.focus()};
document.addEventListener("click",e=>{
 const b=e.target.closest(".choose button");
 if(b){const k=b.dataset.q;state.picks[k]=state.picks[k]===b.dataset.v?undefined:b.dataset.v;if(state.picks[k]==="changes")openNote();sync();return}
 const go=e.target.closest(".chips button");
 if(go){const t=go.closest(".question").querySelector(".track"),c=t.querySelector(`.opt[data-id="${CSS.escape(go.dataset.go)}"]`);t.scrollTo({left:c.offsetLeft-t.offsetLeft,behavior:"smooth"});return}
 const tab=e.target.closest(".tabs button");
 if(tab){document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===tab));document.querySelectorAll("[data-panel]").forEach(p=>p.hidden=p.dataset.panel!==tab.dataset.tab);scrollTo({top:0});return}
 const s=e.target.closest(".shot");
 if(s){const dark=getComputedStyle(s.querySelector(".lt")).display==="none";$("lb").querySelector("img").src=dark&&s.dataset.dk?s.dataset.dk:s.dataset.lt;$("lb").showModal();return}
 if(e.target.closest("#lb"))$("lb").close();
});
// The chip follows the swipe, and on a phone the track takes the height of the card in view
document.querySelectorAll(".track").forEach(t=>{
 const chips=[...t.previousElementSibling.querySelectorAll("button")],cards=[...t.children];
 const mark=()=>{const i=Math.min(cards.length-1,Math.round(t.scrollLeft/(t.clientWidth+16)));chips.forEach((c,j)=>c.setAttribute("aria-current",j===i));t.style.height=getComputedStyle(t.previousElementSibling).display==="none"?"":cards[i].offsetHeight+"px"};
 t.addEventListener("scroll",()=>requestAnimationFrame(mark),{passive:true});addEventListener("resize",mark);t.querySelectorAll("img").forEach(im=>im.addEventListener("load",mark));mark();
});
$("noteBtn").addEventListener("click",()=>{const n=$("note");n.hidden=!n.hidden;if(!n.hidden)n.focus()});
$("note").value=state.note;if(state.note)$("note").hidden=false;
$("note").addEventListener("input",e=>{state.note=e.target.value;save()});
$("copy").addEventListener("click",()=>{
 const text=build(),b=$("copy"),done=t=>{b.textContent=t;setTimeout(()=>b.textContent="Copy reaction",1800)};
 const fallback=()=>{const o=$("out");o.hidden=false;o.value=text;o.select();done("Select and copy")};
 try{navigator.clipboard.writeText(text).then(()=>done("Copied"),fallback)}catch(e){fallback()}
});
// Light / Dark switch, so the other theme's captures are one tap away
const root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":mq.matches;
const label=()=>$("theme").textContent=isDark()?"Light":"Dark";
$("theme").addEventListener("click",()=>{root.dataset.theme=isDark()?"light":"dark";label()});label();
sync();
})();
</script>

</body></html>
