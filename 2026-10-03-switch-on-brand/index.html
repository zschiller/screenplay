<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Switch On Brand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one column. The question, then a round toggle, then Today and that round's options, then the reaction form and Copy. Swap the tokens below for the repo's brand; the defaults are neutral. */
:root{--bg:#ffffff;--surface:#f7f7f7;--line:#e0e0e0;--fg:#000000;--muted:#6e6e6e;--accent:oklch(0.56 0.259 326);--ok:oklch(0.56 0.16 148);--no:oklch(0.56 0.226 27);
--sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--head:"Unbounded","Instrument Sans",ui-sans-serif,system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#0f0f0f;--line:#2b2b2b;--fg:#ffffff;--muted:#a8a8a8;--accent:oklch(0.667 0.295 322.15);--ok:oklch(0.82 0.235 148);--no:oklch(0.66 0.225 27);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000000;--surface:#0f0f0f;--line:#2b2b2b;--fg:#ffffff;--muted:#a8a8a8;--accent:oklch(0.667 0.295 322.15);--ok:oklch(0.82 0.235 148);--no:oklch(0.66 0.225 27);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:40px 120px;display:flex;flex-direction:column;gap:40px}
.lbl{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl.acc{color:var(--accent)}
h1{font:600 clamp(24px,4.5vw,34px)/1.15 var(--head);letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
h2{font:600 clamp(18px,2.4vw,22px)/1.25 var(--head);margin:0;text-wrap:balance}
h3{font:500 16px/1.35 var(--sans);margin:0}
p{margin:0}
a{color:var(--accent)}
blockquote{margin:0;padding-left:14px;border-left:2px solid var(--line);color:var(--muted);max-width:68ch}
.muted{color:var(--muted)}
.rounds{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 13px var(--sans);border-radius:2px;padding:6px 11px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
.shead{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--fg)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
.opt{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.letter{font:600 14px var(--mono);color:var(--accent)}
.badge{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.badge.rec{color:var(--accent);border-color:currentColor}
.badge.picked{color:var(--ok);border-color:currentColor}
.badge.rejected{color:var(--no);border-color:currentColor}
.opt.rejected .shots{opacity:.55}
.cost{font-size:14px;color:var(--muted)}
.cost b{font-weight:500;color:var(--fg)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot{border:1px solid var(--line);background:var(--surface);max-height:480px;overflow:auto}
.shot img{display:block;width:100%;height:auto}
.dk{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dk{display:block!important}:root:not([data-theme="light"]) .has-dk .lt{display:none!important}}
:root[data-theme="dark"] .dk{display:block!important}:root[data-theme="dark"] .has-dk .lt{display:none!important}
figcaption{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:2px;cursor:pointer}
.pick:hover,.pick:has(input:checked){background:var(--surface)}
.pick input{margin:3px 0 0;accent-color:var(--accent)}
textarea,input[type=text]{width:100%;font:14px/1.5 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:7px 10px}
textarea{resize:vertical;min-height:60px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13px;color:var(--ok)}
pre.out{white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:2px;margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
<header>
<p class="lbl acc">Design exploration · 3 Oct 2026</p>
<h1 id="q"></h1>
<blockquote id="quote"></blockquote>
</header>

<nav class="rounds" id="rounds" aria-label="Rounds"></nav>

<section id="today"></section>
<section id="round"></section>

<section id="react">
<div class="shead"><p class="lbl">Your reaction</p><h2 id="reactTitle"></h2><p class="muted">Pick one, or say what's missing. Copy the text and paste it back in the chat.</p></div>
<form id="form"></form>
<div class="row"><button type="button" id="copy" class="primary">Copy reaction</button><span class="status" id="status" role="status" aria-live="polite"></span></div>
<pre class="out" id="preview"></pre>
</section>
</div>

<script>
const IMG=(p,cap,dk)=>({p,cap,dk}); // p: light (or only) capture, dk: optional dark capture
const QUESTION={
 quote:"our switch component looks like it has a visual glitch and doesn't feel on brand",
 q:"What should the shared Switch look like so it feels like the rest of Screenplay?",
 slug:"switch-on-brand"
};
const S=(o,cap)=>[IMG(`r1/${o}-zoom-light.png`,`${cap} · off, on`,`r1/${o}-zoom-dark.png`),IMG(`r1/${o}-list-light.png`,`${cap} · Canvas settings`,`r1/${o}-list-dark.png`)];
const TODAY={facts:"Today is the stock shadcn pill with the glitch fixed (PR #1471): a 32×18.4 track, a round 16px thumb with an even 1px inset, black on white in light and white on black in dark. It is the only fully round control in the kit: Button, Input and Tabs use the 2px corner (--radius 0.125rem, rounded-lg), Checkbox 4px. It appears in Canvas settings › Repositories (desktop) and in the Knobs panel's boolean rows.",shots:S("today","Today")};
const ROUNDS=[
{n:1,feedback:"Zack: the 1px inset fix (PR #1471, merged) is what makes it on brand; none of A to D. Today's stock pill stays.",options:[
 {id:"A",name:"Square, ink",why:"Same colours and size as Today, but the track and thumb take the 2px corner every Button, Input and Tab already uses. It reads like the rest of the kit: monochrome, square, on = filled ink like a primary Button.",cost:"Two class changes in packages/ui's Switch (rounded-full to rounded-lg, thumb rounded-[1px]). No new variant. Slider's round thumb would then be the last pill; worth matching later.",rec:true,state:"rejected",shots:S("a","A")},
 {id:"B",name:"Square, magenta on",why:"A's square shape, with the on track filled solid magenta (the selection and focus-ring colour) under a black thumb, the same in both themes. Black on a neon fill follows the Signal palette rule.",cost:"Spends the accent on a settings control. Magenta means selection on the canvas, so an on switch can read as \"selected\". Off is unchanged.",state:"rejected",shots:S("b","B")},
 {id:"C",name:"Pill, magenta on",why:"Keeps the stock pill shape and only changes colour: magenta fill when on, black thumb. The smallest visual change that still adds the brand colour.",cost:"Keeps the round shape that sets it apart from the 2px kit, and has B's selection-colour clash.",state:"rejected",shots:S("c","C")},
 {id:"D",name:"Square, outline off",why:"Square like A. Off is an outline track with a smaller muted thumb; on fills with ink. Off and on differ by fill as well as position, the way outline and filled Buttons differ.",cost:"Off changes size of the thumb (scaled 75%), so the thumb grows as it slides; a moving size on toggle may feel busy. Muted grey outline is a new use of that token.",state:"rejected",shots:S("d","D")}
]}
];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const shots=list=>list&&list.length?`<div class="shots">`+list.map(i=>`<figure><div class="shot${i.dk?" has-dk":""}"><img class="lt" src="${i.p}" alt="${esc(i.cap)}" loading="lazy">${i.dk?`<img class="dk" src="${i.dk}" alt="" aria-hidden="true" loading="lazy">`:""}</div><figcaption>${esc(i.cap)}</figcaption></figure>`).join("")+`</div>`:"";
const KEY="exploration-"+QUESTION.slug;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let current=ROUNDS[0].n;

$("q").textContent=QUESTION.q;$("quote").textContent=QUESTION.quote;
$("today").innerHTML=`<div class="shead"><p class="lbl">Today</p><h2>What main does now</h2><p class="muted">${esc(TODAY.facts)}</p></div>`+shots(TODAY.shots);
$("rounds").innerHTML=`<span class="lbl">Round</span>`+ROUNDS.map(r=>`<button type="button" data-n="${r.n}">${r.n}${r===ROUNDS[0]?" · latest":""}</button>`).join("");
$("rounds").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(b){current=+b.dataset.n;render()}});

function render(){
 const r=ROUNDS.find(x=>x.n===current),latest=r===ROUNDS[0];
 $("rounds").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===current)));
 $("round").innerHTML=`<div class="shead"><p class="lbl">Round ${r.n}</p><h2>${r.options.length} options</h2>${r.feedback?`<blockquote>${esc(r.feedback)}</blockquote>`:""}</div><div class="opts">`+
  r.options.map(o=>`<article class="opt ${o.state}" id="r${r.n}-${o.id}"><header><span class="letter">${o.id}</span><h3>${esc(o.name)}</h3>${o.rec?'<span class="badge rec">Recommended</span>':""}${o.state?`<span class="badge ${o.state}">${o.state==="picked"?"Picked":"Rejected"}</span>`:""}</header>${shots(o.shots)}<p>${esc(o.why)}</p><p class="cost"><b>Cost</b> ${esc(o.cost)}</p></article>`).join("")+`</div>`;
 $("react").hidden=!latest;
 if(latest)renderForm(r);
}
function renderForm(r){
 $("reactTitle").textContent=`Round ${r.n}`;
 const opts=r.options.map(o=>[o.id,`${o.id}: ${o.name}${o.rec?" (recommended)":""}`]).concat([["none","None of these"],["mix","A mix (say which parts below)"]]);
 $("form").innerHTML=`<fieldset><legend>Pick</legend>`+opts.map(([v,l])=>`<label class="pick"><input type="radio" name="pick" id="pick-${v}" value="${v}"><span>${esc(l)}</span></label>`).join("")+`</fieldset>`+
  `<p class="lbl" style="margin-top:12px">Notes</p><textarea id="note" aria-label="Notes"></textarea>`;
 if(saved.round===r.n){const el=$("pick-"+saved.pick);if(el)el.checked=true;$("note").value=saved.note||""}
 preview();
}
function build(){
 const r=ROUNDS[0],p=$("form").querySelector("input[name=pick]:checked"),note=$("note").value.trim();
 const o=p&&r.options.find(x=>x.id===p.value);
 const pick=!p?"No pick yet":o?`${o.id}: ${o.name}`:p.value==="none"?"None of these":"A mix";
 return[`Exploration: ${QUESTION.q}`,`Round ${r.n}`,`→ ${pick}`].concat(note?[`Note: ${note}`]:[]).join("\n");
}
function preview(){
 $("preview").textContent=build();
 const p=$("form").querySelector("input[name=pick]:checked");
 try{localStorage.setItem(KEY,JSON.stringify({round:ROUNDS[0].n,pick:p?p.value:"",note:$("note").value}))}catch(e){}
}
$("form").addEventListener("input",preview);
$("form").addEventListener("submit",e=>e.preventDefault());
$("copy").addEventListener("click",()=>{
 const text=build(),st=$("status");
 const fallback=()=>{const p=$("preview"),r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);st.textContent="Copy was blocked. The text is selected; copy it by hand."};
 try{navigator.clipboard.writeText(text).then(()=>{st.textContent="Copied. Paste it in the chat."},fallback)}catch(e){fallback()}
});
render();
</script>

</body></html>
