<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Panel Tabs Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. The question, then a round toggle, then Today and that round's options as grey-box panel wireframes, then the reaction form. Screenplay brand: Unbounded titles, Instrument Sans UI. */
:root{--bg:#fbfbfa;--surface:#f1f1ef;--line:#e2e2df;--fg:#161615;--muted:#5d5d59;--accent:#3f5fe0;--ok:#1f7a45;--no:#a3372b;--box:#e7e7e4;--box2:#d6d6d2;--ink:#161615;--paper:#ffffff;--orange:#e8741c;
--sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Unbounded","Instrument Sans",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#8ea4f5;--ok:#5fd08e;--no:#f08a7c;--box:#262624;--box2:#363633;--ink:#f1f1ef;--paper:#171716;--orange:#f59a4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#8ea4f5;--ok:#5fd08e;--no:#f08a7c;--box:#262624;--box2:#363633;--ink:#f1f1ef;--paper:#171716;--orange:#f59a4a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:40px 120px;display:flex;flex-direction:column;gap:40px}
.lbl{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl.acc{color:var(--accent)}
h1{font:600 clamp(22px,4vw,30px)/1.2 var(--head);letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
h2{font:500 clamp(16px,2.2vw,19px)/1.3 var(--head);margin:0;text-wrap:balance}
h3{font:600 16px/1.35 var(--sans);margin:0}
p{margin:0}
a{color:var(--accent)}
blockquote{margin:0;padding-left:14px;border-left:2px solid var(--line);color:var(--muted);max-width:68ch}
.muted{color:var(--muted)}
.rounds{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 13px var(--sans);border-radius:6px;padding:6px 11px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
.shead{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--fg)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px 24px}
.opt{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.letter{font:600 14px var(--mono);color:var(--accent)}
.badge{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.badge.rec{color:var(--accent);border-color:currentColor}
.badge.picked{color:var(--ok);border-color:currentColor}
.badge.rejected{color:var(--no);border-color:currentColor}
.opt.rejected .shots{opacity:.55}
.cost{font-size:14px;color:var(--muted)}
.cost b{font-weight:600;color:var(--fg)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot{border:1px solid var(--line);background:var(--surface);max-height:520px;overflow:auto}
.shot img{display:block;width:100%;height:auto}
.dk{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dk{display:block!important}:root:not([data-theme="light"]) .has-dk .lt{display:none!important}}
:root[data-theme="dark"] .dk{display:block!important}:root[data-theme="dark"] .has-dk .lt{display:none!important}
figcaption{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 28px;margin:0;padding:0;list-style:none}
.facts li{font-size:14px;line-height:1.5;padding-left:14px;position:relative;min-width:0}
.facts li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
code{font:12.5px var(--mono);background:var(--surface);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
/* Wireframe panel */
.wires{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.wf{display:flex;flex-direction:column;gap:5px;min-width:0}
.panel{border:1px solid var(--box2);border-radius:8px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;height:330px;font:12px/1.3 var(--sans);color:var(--ink)}
.ph{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--box2);min-height:38px}
.crumb{color:var(--muted);white-space:nowrap}
.ph .sp{flex:1}
.ib{width:22px;height:22px;border-radius:5px;background:var(--box);display:grid;place-items:center;font:500 10px var(--mono);color:var(--muted);flex:none}
.ib.on{background:var(--box2);color:var(--ink)}
.pill{padding:3px 7px;border-radius:5px;background:var(--box);font-size:11px;white-space:nowrap}
.strip{display:flex;align-items:stretch;gap:2px;padding:0 6px;border-bottom:1px solid var(--box2);height:32px;overflow:hidden}
.tab{display:flex;align-items:center;gap:4px;padding:0 7px;font-size:11.5px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tab .g{font:500 9.5px var(--mono)}
.body{flex:1;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:0}
.msg{height:9px;border-radius:3px;background:var(--box)}
.msg.u{align-self:flex-end;width:55%;height:22px;border-radius:7px}
.msg.w80{width:80%}.msg.w60{width:60%}.msg.w90{width:90%}.msg.w40{width:40%}
.comp{margin:0 10px 10px;border:1px solid var(--box2);border-radius:8px;padding:7px 8px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.comp .sp{flex:1}
.term{flex:1;margin:0;background:#141413;color:#d8d8d2;font:10.5px/1.45 var(--mono);padding:9px 10px;white-space:pre;overflow:hidden}
.menu{position:absolute;top:34px;left:10px;right:34px;background:var(--paper);border:1px solid var(--box2);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:4px;display:flex;flex-direction:column;gap:1px;z-index:2}
.mi{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;font-size:11.5px}
.mi.on{background:var(--box)}
.mi .sp{flex:1}
.mi .k{font:500 9.5px var(--mono);color:var(--muted);width:14px;text-align:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--orange);flex:none}
.rel{position:relative}
.seg{display:flex;border-radius:6px;background:var(--box);padding:2px;gap:2px}
.seg span{padding:2px 7px;border-radius:4px;font-size:11px;color:var(--muted)}
.seg span.on{background:var(--paper);color:var(--ink);font-weight:500}
.ttb{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#1e1e1c;color:#a9a9a2;font:500 10.5px var(--sans);border-bottom:1px solid #2c2c2a}
.ttb .sp{flex:1}
.tb{padding:2px 7px;border-radius:4px;background:#2c2c2a;color:#e6e6e0;font:500 10.5px var(--sans);white-space:nowrap}
.gd{width:6px;height:6px;border-radius:50%;background:#3fb96b;flex:none;display:inline-block}
.subs{display:flex;gap:2px;padding:0 6px;border-bottom:1px solid var(--box2);height:28px;background:var(--surface)}
.cv{border:1px solid var(--box2);border-radius:8px;background:var(--surface);height:330px;position:relative;overflow:hidden;font:11px/1.3 var(--sans);color:var(--ink)}
.lay{position:absolute;display:flex;flex-direction:column;gap:3px}
.lay .lb{display:flex;gap:5px;align-items:center;font-size:10.5px;white-space:nowrap}
.lay .lb .m{color:var(--muted)}
.fr{border:1px solid var(--box2);border-radius:4px;background:var(--paper);flex:1;display:flex;flex-direction:column;overflow:hidden}
.fr .hero{height:34%;margin:8px;border-radius:3px;background:var(--box2)}
.fr .ln{height:6px;margin:3px 8px;border-radius:2px;background:var(--box)}
.fbar{display:flex;gap:4px;align-items:center;padding:4px 6px;border:1px solid var(--box2);border-radius:7px;background:var(--paper);font-size:10.5px;white-space:nowrap;align-self:center}
.fbar .ib{width:18px;height:18px;font-size:9px}
.lay .term{font-size:9.5px;border-radius:4px}
.xl{outline:2px solid var(--accent);outline-offset:1px}
.split{height:6px;display:grid;place-items:center;border-top:1px solid var(--box2);border-bottom:1px solid var(--box2);background:var(--surface)}
.split::after{content:"";width:28px;height:2px;border-radius:2px;background:var(--box2)}
.pstrip{display:flex;align-items:center;gap:2px;padding:0 6px;height:28px;border-bottom:1px solid var(--box2)}
.pstrip .sp{flex:1}
.pstrip .tab{border-bottom-width:2px}
.slim{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--box2);font-size:11px;color:var(--muted)}
.slim .sp{flex:1}
.note{font:500 10px/1.3 var(--mono);color:var(--accent);letter-spacing:.02em}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer}
.pick:hover,.pick:has(input:checked){background:var(--surface)}
.pick input{margin:3px 0 0;accent-color:var(--accent)}
textarea{width:100%;font:14px/1.5 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;resize:vertical;min-height:60px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13px;color:var(--ok)}
pre.out{white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:6px;margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
<header>
<p class="lbl acc">Design exploration · 30 Sep 2026</p>
<h1 id="q"></h1>
<blockquote id="quote"></blockquote>
</header>

<nav class="rounds" id="rounds" aria-label="Rounds"></nav>

<section id="today"></section>
<section id="round"></section>

<section id="react">
<div class="shead"><p class="lbl">Your reaction</p><h2 id="reactTitle"></h2><p class="muted">Pick one, or say what's missing. Copy the text and paste it back in the chat.</p></div>
<form id="form"></form>
<div class="row"><button type="button" id="copy" class="primary">Copy reaction</button><span class="status" id="status" role="status" aria-live="polite"></span></div>
<pre class="out" id="preview"></pre>
</section>
</div>

<script>
const IMG=(p,cap,dk)=>({p,cap,dk});
const QUESTION={
 quote:"“We should think about how useful having multiple chat tabs and terminal tabs at all even is now.” — Zack",
 q:"Once every chat has exactly one Workspace, does a Workspace's panel still need a tab strip?",
 slug:"panel-tabs"
};

// Wireframe helpers: grey boxes, real labels.
const chatBody=`<div class="body"><div class="msg u"></div><div class="msg w90"></div><div class="msg w80"></div><div class="msg w60"></div><div class="msg u" style="width:40%"></div><div class="msg w80"></div><div class="msg w40"></div></div>`;
const comp=(model)=>`<div class="comp">Ask for changes…<span class="sp"></span><span class="pill">${model}</span></div>`;
const hdr=(title,right)=>`<div class="ph"><span class="crumb">Coordinator ›</span><b style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</b><span class="sp"></span>${right||""}</div>`;
const tuiBody=`<pre class="term"> ✳ Welcome to Claude Code

 > fix the flaky checkout test

 ● Read(test/checkout.spec.ts)
 ● Update(src/cart.ts)
   ⎿  +4 −2

 ✳ Thinking…  (esc to interrupt)</pre>`;
const shellBody=`<pre class="term">~/checkout-polish $ pnpm test cart
 PASS  test/cart.spec.ts (14)
 FAIL  test/checkout.spec.ts
   ✕ applies promo code

~/checkout-polish $ █</pre>`;
const panel=(inner,cls="")=>`<div class="panel ${cls}">${inner}</div>`;
const wf=(cap,inner,note)=>`<div class="wf">${inner}<figcaption>${cap}</figcaption>${note?`<p class="note">${note}</p>`:""}</div>`;

const TODAY_WIRE=`<div class="wires">`+
 wf("Today · a Workspace's panel",panel(hdr("Checkout polish",`<span class="pill">PR</span>`)+`<div class="strip"><span class="tab"><span class="g">≡</span></span><span class="tab on">Fix checkout</span><span class="tab">Promo codes</span><span class="tab"><span class="g">&gt;_</span>Claude Code</span><span class="tab"><span class="g">&gt;_</span>Terminal</span><span class="tab">+▾</span></div>`+chatBody+comp("Sonnet 5.5")),"Logs pinned left, chats and terminals mixed, sticky + with a New chat / New terminal menu, history on the right")+
 wf("After #1315 as filed",panel(hdr("Checkout polish",`<span class="pill">PR</span>`)+`<div class="strip"><span class="tab"><span class="g">≡</span></span><span class="tab on">Fix checkout</span><span class="tab"><span class="g">&gt;_</span>Claude Code</span><span class="tab"><span class="g">&gt;_</span>Terminal</span><span class="tab">+▾</span></div>`+chatBody+comp("Sonnet 5.5")),"One chat tab left; the strip now exists only for Logs and terminals")+
`</div>`;

const TODAY={
 facts:[
  `The strip mixes Chat Sessions and Terminal Tabs in one drag-reorderable row, with Logs pinned at the left and a Chat history menu at the right (<code>chat-panel.tsx:1049-1287</code>).`,
  `The + button repeats whichever kind you made last; its caret offers New chat or New terminal per installed harness (<code>chat-panel.tsx:1216-1262</code>, <code>tab-kind.ts</code>). Closing the last tab respawns one (<code>tab-pool.ts</code>, never-empty rule).`,
  `Spec #1308 / #1315 already remove several chats per Workspace: “Opening several chat tabs on one Workspace goes away; Terminal Tabs are unchanged.” Chats are reached from the Chats menu (#1317) and chat cards (#1318).`,
  `A Terminal Tab launches a harness (Claude Code by default, <code>tab-kind.ts:DEFAULT_HARNESS_KEY</code>) or a shell in the Workspace's sandbox. It is saved per user, its scrollback dies with the sandbox, and it is not a Chat Session: the Coordinator, chat cards, steering and question cards can't see into it (<code>CONTEXT.md</code>, Terminal Tab).`,
  `So a Claude Code terminal is a second agent editing a Workspace, which #1315 says only the owning chat may do.`,
  `On desktop a chat can already be backed by Claude Code or Codex (the model pill's <code>harness:&lt;key&gt;</code> ids, <code>engine-select.ts</code>). Hosted runs chats in-process only, so there a terminal is the only way to use Claude Code (<code>availability.ts:15-30</code>).`,
  `Your rule from PR #829: terminals stay beside chats, never in a separate drawer, because “terminals are used as chats when running a harness”. None of the options below move them into a drawer.`
 ],
 wire:TODAY_WIRE,
 shots:[IMG("today/panel.light.png","Before #1315 · Logs, three chats, Chat history","today/panel.dark.png"),IMG("r3/today.light.png","Main after #1315 · a terminal tab open","r3/today.dark.png")]
};

const ROUNDS=[
{n:5,feedback:"\u201cMaybe something like C actually but with the footnote style? And a nice transition on open \u2026 to maybe B.\u201d Read as: closed is round 4 C's borderless footnote, listing the terminals the way round 4 B did; open grows into round 3 B's tab strip. One design this round, recorded in motion.",
 recWhy:"",
 options:[
 {id:"A",name:"Footnote that grows into the tab strip",rec:true,state:"",shots:[IMG("r5/closed.light.png","Closed · footnote","r5/closed.dark.png"),IMG("r5/open.light.png","Open · tab strip","r5/open.dark.png"),IMG("r5/transition.light.gif","Open, then close (click the footnote; caret hides)","r5/transition.dark.gif")],
  why:"Closed, a 28px borderless line under the composer: the dev server's dot and \u201cDev server\u201d, then \u201cShell\u201d and \u201cShell 2\u201d, all muted 12px. Clicking any name opens the pane on that terminal. Opening is one 280ms motion on the product's tab ease (cubic-bezier(0.16,1,0.3,1), the curve new tabs already enter with): the pane grows from 28px to 44% of the panel, the line grows to 40px, its labels scale from 12 to 14px, hairlines fade in above and below, the selected name takes the underline and medium weight, and + with Restart, Stop and the hide caret fade up. The output fades in 80ms behind. Closing plays it backwards.",
  cost:"Labels scale between 12 and 14px mid-motion, which needs care to stay crisp (a transform-based scale would be cheaper than animating font-size). A resizable pane also has a dragged height; the motion animates to whatever height you left it at. The full-quality MP4s are r5/transition.light.mp4 and r5/transition.dark.mp4 on this page."}
]},
{n:4,feedback:"\u201cCan we explore more on the bar is always there but make the collapsed state more minimal.\u201d Round 3's B is the base: open, the bar rises and becomes the pane's tab strip (round 3 B's open shot). These are only the closed bar, on the same real captures. Round 3's closed bar, for comparison, was 40px with \u201cDev server running \u00b7 2 shells\u201d, Stop and a caret.",
 recWhy:"It's the quietest bar that is still a bar: one muted word with the state dot, the same hairline the composer already sits on, and a caret that says it opens. Stop moves into the open bar and the dot's colour carries crashes, so nothing in the closed row competes with the composer.",
 options:[
 {id:"A",name:"Dot, name, caret",rec:true,state:"",shots:[IMG("r4/a.light.png","A · Closed","r4/a.dark.png")],
  why:"32px instead of 40. Just the dev server's state dot, \u201cDev server\u201d in muted 12px, and a caret to open. No Stop, no shell count: those live in the open bar. The dot turns red when the server crashes.",
  cost:"Stopping the server takes a click to open first. Nothing says you have shells running until you open it."},
 {id:"B",name:"The tabs, resting",state:"",shots:[IMG("r4/b.light.png","B · Closed","r4/b.dark.png")],
  why:"Closed shows the same tabs the open bar has (Dev server, Shell, Shell 2), all inactive and muted, with no controls. Clicking a tab opens the pane on that terminal. The bar never changes shape, only the pane appears above it.",
  cost:"The tallest and busiest of the four (40px, a word per shell). With many shells it scrolls sideways like today's strip."},
 {id:"C",name:"A footnote under the composer",state:"picked",shots:[IMG("r4/c.light.png","C · Closed","r4/c.dark.png")],
  why:"No border, no fill, 24px: a muted line tucked under the composer, like a status footnote, with the dot and \u201cDev server\u201d on the left and \u201c2 shells\u201d on the right. Click anywhere on it to open.",
  cost:"It reads as part of the composer rather than a control, so it's easy to miss that it opens. No caret or controls."},
 {id:"D",name:"A, with controls on hover",state:"",shots:[IMG("r4/d.light.png","D · Closed, hovered","r4/d.dark.png")],
  why:"Resting it's exactly A. On hover the row takes the muted fill and shows the shell count, Restart and Stop, so stopping the server never needs the pane open.",
  cost:"Controls that only appear on hover are hidden on touch and from anyone who doesn't think to hover. One more state to build and test."}
]},
{n:3,feedback:"\u201cYea I like this option the most, can we do design refinement on the UI now? E.g. do we always need the bar? How minimal can it look.\u201d Real captures of the Workspace panel at the 30% default width, restyled in the browser. The chat is Checkout polish's conversation with the live composer; the pane shows the stubbed dev server output. Today is main after #1315.",
 notes:["The header's terminal button and \u2303\u0060 open and close the pane; dragging the divider to the bottom also closes it. Height and open/closed are remembered per person, across Workspaces.","A frame's \u201cOpen logs\u201d opens the pane on Dev server. It no longer opens by itself when the sandbox connects (today's logs tab does, chat-panel.tsx:904); a crashed dev server turns the button's dot red instead.","Dev server is a read-only terminal (tail -F of the dev server log), always first, can't be closed or renamed. Ctrl-C there doesn't stop the server; Stop does. Stopped, it keeps its output and offers Run.","+ opens a shell and selects it; \u00d7 asks first if something is running, then selection falls to the neighbour, then Dev server. Shells survive reloads and stay private to you, as Terminal Tabs do today."],
 recWhy:"One quiet row, no tabs: it borrows the Chats menu's pattern (a menu naming what you're looking at), keeps Stop and Restart one click away, and grows to any number of shells without a strip. A is the pick if you'd rather see your shells at a glance.",
 options:[
 {id:"A",name:"Tab strip in the pane",state:"",shots:[IMG("r3/a-open.light.png","A · Pane open","r3/a-open.dark.png"),IMG("r3/a-closed.light.png","A · Pane closed","r3/a-closed.dark.png")],

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const shots=list=>list&&list.length?`<div class="shots">`+list.map(i=>`<figure><div class="shot${i.dk?" has-dk":""}"><img class="lt" src="${i.p}" alt="${esc(i.cap)}" loading="lazy">${i.dk?`<img class="dk" src="${i.dk}" alt="" aria-hidden="true" loading="lazy">`:""}</div><figcaption>${esc(i.cap)}</figcaption></figure>`).join("")+`</div>`:"";
const KEY="exploration-"+QUESTION.slug;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let current=ROUNDS[0].n;

$("q").textContent=QUESTION.q;$("quote").textContent=QUESTION.quote;
$("today").innerHTML=`<div class="shead"><p class="lbl">Today</p><h2>What main does now</h2></div><ul class="facts">`+TODAY.facts.map(f=>`<li>${f}</li>`).join("")+`</ul>`+`<div style="max-width:620px">`+shots(TODAY.shots)+`</div>`+TODAY.wire;
$("rounds").innerHTML=`<span class="lbl">Round</span>`+ROUNDS.map(r=>`<button type="button" data-n="${r.n}">${r.n}${r===ROUNDS[0]?" · latest":""}</button>`).join("");
$("rounds").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(b){current=+b.dataset.n;render()}});

function render(){
 const r=ROUNDS.find(x=>x.n===current),latest=r===ROUNDS[0];
 $("rounds").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===current)));
 $("round").innerHTML=`<div class="shead"><p class="lbl">Round ${r.n}</p><h2>${r.options.length} options</h2>${r.feedback?`<blockquote>${esc(r.feedback)}</blockquote>`:""}${r.notes?`<p class="lbl" style="margin-top:6px">Open and close (proposed)</p><ul class="facts">${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div><div class="opts">`+
  r.options.map(o=>`<article class="opt ${o.state}" id="r${r.n}-${o.id}"><header><span class="letter">${o.id}</span><h3>${esc(o.name)}</h3>${o.rec?'<span class="badge rec">Recommended</span>':""}${o.state?`<span class="badge ${o.state}">${o.state==="picked"?"Picked":"Rejected"}</span>`:""}</header>${o.wire||""}${shots(o.shots)}<p>${esc(o.why)}</p><p class="cost"><b>Cost</b> ${esc(o.cost)}</p></article>`).join("")+`</div>`+
  (r.recWhy?`<p class="muted" style="font-size:14px"><b style="color:var(--fg);font-weight:600">Why ${r.options.find(o=>o.rec).id}.</b> ${esc(r.recWhy)}</p>`:"");
 $("react").hidden=!latest;
 if(latest)renderForm(r);
}
function renderForm(r){
 $("reactTitle").textContent=`Round ${r.n}`;
 const opts=r.options.map(o=>[o.id,`${o.id}: ${o.name}${o.rec?" (recommended)":""}`]).concat([["none","None of these"],["mix","A mix (say which parts below)"]]);
 $("form").innerHTML=`<fieldset><legend>Pick</legend>`+opts.map(([v,l])=>`<label class="pick"><input type="radio" name="pick" id="pick-${v}" value="${v}"><span>${esc(l)}</span></label>`).join("")+`</fieldset>`+
  `<p class="lbl" style="margin-top:12px">Notes</p><textarea id="note" aria-label="Notes"></textarea>`;
 if(saved.round===r.n){const el=$("pick-"+saved.pick);if(el)el.checked=true;$("note").value=saved.note||""}
 preview();
}
function build(){
 const r=ROUNDS[0],p=$("form").querySelector("input[name=pick]:checked"),note=$("note").value.trim();
 const o=p&&r.options.find(x=>x.id===p.value);
 const pick=!p?"No pick yet":o?`${o.id}: ${o.name}`:p.value==="none"?"None of these":"A mix";
 return[`Exploration: ${QUESTION.q}`,`Round ${r.n}`,`→ ${pick}`].concat(note?[`Note: ${note}`]:[]).join("\n");
}
function preview(){
 $("preview").textContent=build();
 const p=$("form").querySelector("input[name=pick]:checked");
 try{localStorage.setItem(KEY,JSON.stringify({round:ROUNDS[0].n,pick:p?p.value:"",note:$("note").value}))}catch(e){}
}
$("form").addEventListener("input",preview);
$("form").addEventListener("submit",e=>e.preventDefault());
$("copy").addEventListener("click",()=>{
 const text=build(),st=$("status");
 const fallback=()=>{const p=$("preview"),r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);st.textContent="Copy was blocked. The text is selected; copy it by hand."};
 try{navigator.clipboard.writeText(text).then(()=>{st.textContent="Copied. Paste it in the chat."},fallback)}catch(e){fallback()}
});
render();
</script>
