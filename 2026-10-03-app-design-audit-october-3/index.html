<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>App Design Audit, October 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone first, one column. Header, filter tabs (All / Calls / one per depth), then one card per finding with its captures and its pick row. A bar pinned to the bottom carries the tally, a note and Copy. Swap the tokens below for the repo's brand; the defaults are neutral. */
:root{--bg:#fbfbfa;--surface:#f3f3f1;--line:#e2e2df;--fg:#161615;--muted:#5d5d59;--accent:#c4108a;--ok:#1f7a45;--no:#a3372b;--hi:#b42318;--med:#a15c00;
--sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--head:"Unbounded",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#ff4fc8;--ok:#5fd08e;--no:#f08a7c;--hi:#ff6b5e;--med:#f0a640;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#ff4fc8;--ok:#5fd08e;--no:#f08a7c;--hi:#ff6b5e;--med:#f0a640;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:24px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
@media (min-width:720px){.wrap{padding-inline:24px;padding-top:40px}}
.lbl{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.lbl.acc{color:var(--accent)}
h1{font:600 clamp(22px,5.4vw,32px)/1.18 var(--head);letter-spacing:-.015em;margin:8px 0 10px;text-wrap:balance}
h2{font:600 clamp(17px,4.4vw,21px)/1.28 var(--head);margin:0;text-wrap:balance}
h3{font:500 16px/1.4 var(--sans);margin:0;text-wrap:balance}
p{margin:0;max-width:72ch}
a{color:var(--accent)}
code{font:12.5px var(--mono);overflow-wrap:anywhere}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lede{display:flex;flex-direction:column;gap:8px;color:var(--muted)}
button{font:500 13px/1.2 var(--sans);border-radius:8px;padding:8px 12px;min-height:36px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Filter tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media (min-width:720px){.tabs{margin-inline:-24px;padding-inline:24px}}
.tabs button{border-color:transparent;background:transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
/* Notices: something in flight that may change findings */
.notice{border:1px solid var(--med);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
/* Depth heading and finding cards */
.dhead{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--fg);margin-top:8px}
.finding{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line);scroll-margin-top:64px;min-width:0}
.finding header{display:flex;gap:10px;align-items:baseline}
.fid{font:600 13px var(--mono);color:var(--accent);flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.badge{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.badge.high{color:var(--hi);border-color:currentColor}
.badge.med{color:var(--med);border-color:currentColor}
.badge.call{color:var(--accent);border-color:currentColor}
.badge.pend{color:var(--med);border-color:currentColor}
.box{border-radius:8px;padding:10px 12px;font-size:14px;max-width:72ch}
.box.pend{border:1px solid var(--med)}
.box.call{background:var(--surface)}
.fix b,.box b{font-weight:600}
details.ev summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:500}
details.ev ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
/* Pick row: Fix / Skip, or one button per option of a call */
.choose{display:flex;gap:8px;flex-wrap:wrap}
.choose button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.choose button[aria-pressed="true"]::before{content:"✓ "}
.choose .rec{color:var(--accent)}
.choose button[aria-pressed="true"] .rec{color:inherit}
.fnote{width:100%;font:14px/1.45 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:56px}
/* Captures: the viewer's theme only, tap to enlarge */
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:0;background:var(--surface);cursor:zoom-in;min-height:0}
.shot img{display:block;width:100%;height:auto}
.dk{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dk{display:block!important}:root:not([data-theme="light"]) .has-dk .lt{display:none!important}}
:root[data-theme="dark"] .dk{display:block!important}:root[data-theme="dark"] .has-dk .lt{display:none!important}
figcaption{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dialog.lb{padding:0;border:0;background:transparent;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh}
dialog.lb::backdrop{background:rgb(0 0 0/.86)}
dialog.lb .in{width:100%;height:100%;overflow:auto;display:grid;place-items:center;padding:16px;cursor:zoom-out}
dialog.lb img{max-width:none;background:var(--surface)}
@media (min-width:720px){dialog.lb img{max-width:100%}}
/* Closing notes: checked and fine, merged, method */
details.fold{border:1px solid var(--line);border-radius:10px}
details.fold>summary{cursor:pointer;padding:12px 14px;font-weight:500}
details.fold>.body{padding:0 14px 14px;font-size:14px;color:var(--muted)}
details.fold ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* Bottom bar: tally, a note, Copy */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.bar{padding-inline:24px}}
.bar .in{max-width:912px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.bar .row{display:flex;align-items:center;gap:8px}
.bar .picks{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--muted)}
.bar .picks b{color:var(--fg);font-weight:500}
.bar textarea{width:100%;font:15px/1.45 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:72px}
#copy{min-width:112px}
.bar #out{font:12.5px/1.5 var(--mono)}
</style>

<script>

const PAGE={"title": "App design audit", "date": "3 Oct 2026", "slug": "screenplay-app-2026-10-03", "lede": ["Product, interaction and visual nits over apps/app (desktop and hosted) at main 05fc1cd, with most effort on what shipped since the 30 September audits. Nothing from the settled lists is re-raised; where a 30 September finding is still on main it says so.", "Pick <b>Fix</b> or <b>Skip</b> on each finding and answer each call, add notes, then press <b>Copy picks</b> and paste the text back in this thread. Anything left unpicked keeps the recommendation. No tickets until you say so."], "links": []};
const DEPTHS=[{"key": "P", "name": "Product", "blurb": "Is every claim true, and what is a real user missing. Checked in code."}, {"key": "H", "name": "Interaction", "blurb": "What people see first, what they can reach, and where flows dead-end."}, {"key": "N", "name": "Visual nits", "blurb": "Spacing, type, colour and component drift. Fixes are in the prototype patch."}];
const NOTICES=[{"title": "Pending the live frames rethink", "body": "Frames are moving from live by default to a personal Go live toggle that replaces Detach (round 3 still open). P1 and P6 are likely moot, P5 changes and P7 may change."}];
const FINDINGS=[{"id": "P1", "sev": "high", "title": "Detach says “Only you see it”, but a Knob changed on a detached copy changes the shared frame for everyone", "wrong": "The Detach tooltip says “Use your own copy. Only you see it.” and the docs say what you do there never changes the shared frame. While detached, route, scroll and state go local, but Knob changes still write to the shared frame, and other people’s Knob changes still reach your copy.", "evidence": ["components/canvas/frame-driver.tsx:250-255 (tooltip)", "guides/frames.mdx:214-215 (docs promise)", "canvas-member-layer.tsx:627-640 swaps handlers for local ones; :637 passes updateKnobValues unconditionally", "iframe-layer.tsx:456-466, 678-684 (Knob values reach the shared page)"], "fix": "Keep Knob values in the local copy’s entry the way route is kept (use-shared-frames.ts:16-21) and drop them on rejoin.", "pend": {"tag": "Likely moot", "why": "Detach is being replaced by a personal Go live toggle, and frames that aren’t live keep syncing route and shared state. Carry one question into that design instead: when you’re not live, do Knob changes stay yours or reach everyone? Today’s tooltip and the docs promise they stay yours."}}, {"id": "P2", "sev": "high", "title": "A chat waiting on a question reads Ready, with no needs-you dot", "wrong": "A question card ends the turn and waits for your pick, but the Chats row sits under Idle as Ready and the Chats button shows no orange dot. Needs-you only counts a pending plan, a blocked merge and failed setup.", "evidence": ["lib/agent/acp/in-process-engine.ts:184 (turn stops on ask_question)", "lib/branch/workspace-state.ts:95-99, :148, :214-219", "chats-menu.tsx:366-369", "guides/workspaces.mdx:96-98, 118-121, 150-153 omit questions"], "fix": "Add questionPending beside planPending in roomWorkspaceFacts (isQuestionCall + the answered rule in lib/agent/question.ts), labelled “Question waiting”. Update the docs lists."}, {"id": "P3", "sev": "high", "title": "Hosted Remove repository doesn’t say it’s removed for everyone, with the canvas’s edits", "wrong": "The confirm says only “The repository is removed from this canvas.” It also drops the canvas’s edits and env values for everyone, and a teammate’s repository never reappears under Your other repositories, so you can’t put it back yourself. The docs say you can “turn it back on later”.", "evidence": ["canvas-settings-dialog.tsx:315-322 (the code comment says it goes for everyone)", "delete-repo-dialog.tsx:93-99", "lib/repository-library/canvas.ts:336-346", "guides/repositories.mdx:137-145"], "fix": "On hosted add “It’s removed for everyone on this canvas, with any changes made here.” and, when someone else added it, “Ana added it.” Fix the docs sentence."}, {"id": "P4", "sev": "med", "title": "Desktop: switching off a customized repository throws its canvas edits away without asking", "wrong": "A repository with the orange Customized dot holds edits that exist nowhere else. With no workspaces using it, flipping the switch off loses them silently; switching back on re-copies from Settings.", "evidence": ["canvas-settings-dialog.tsx:318-321 confirms only when workspaces use it; customized (:371-375) is never read", "lib/repository-library/canvas.ts:130", "guides/repositories.mdx:139-140"], "fix": "Also confirm when customized: “Its changes on this canvas are lost.”", "call": {"q": "Confirm before switching off a customized repository?", "options": [{"id": "A", "label": "Confirm", "rec": true}, {"id": "B", "label": "Accept the loss, document it"}]}, "related": "H3"}, {"id": "P5", "sev": "med", "title": "Hosted frames quietly fall back to per-viewer iframes, while the docs say every hosted frame is shared", "wrong": "An old sandbox, SHARED_FRAMES=off, or four failed checks each give every viewer their own iframe. Then nobody sees your clicks, there’s no Theme knob, asking for control does nothing and the agent can’t drive it. The agent is told why; the person never is.", "evidence": ["app/api/frame-stream/route.ts:13-19, 37-38, 49-53; reason only logged at :67-71", "lib/frame-stream/client.ts:303-315", "lib/frame-drive/hosted/live.ts:150", "guides/frames.mdx:149-160"], "fix": "A quiet tag on those frames, like Detached, with a tooltip such as “Only you see this frame. Restart the workspace to share it.” Add a docs line that old workspaces need a restart. Wording only.", "pend": {"tag": "Changes", "why": "Once frames aren’t live by default, a per-viewer iframe is the normal state, so the silent fallback stops being surprising. What remains is Go live failing quietly on an old sandbox or a disabled flag; the toggle should say why it can’t go live."}}, {"id": "P6", "sev": "med", "title": "Detach shows nothing for up to ~10 s, and a second click starts over", "wrong": "Until the snapshot and the seed finish (5 s timeout each) the toggle stays unpressed, with no tag and no spinner. Clicking again re-runs goLocal.", "evidence": ["use-shared-frames.ts:105-113, 126-158", "iframe-layer.tsx:1122-1127", "canvas-member-layer.tsx:571-584", "lib/frame-stream/client.ts:75; seed.ts:18"], "fix": "Expose pending: show the toggle pressed with the regular spinner in its icon’s place, and ignore clicks while pending.", "pend": {"tag": "Likely moot", "why": "Detach goes away. The same lesson applies to Go live: if joining the stream takes seconds, the toggle needs a pending state and should ignore a second click."}}, {"id": "P7", "sev": "med", "title": "Asking for control: no visible asked state, Not now is silent, and an idle driver keeps the frame forever", "wrong": "After you ask, the button looks the same; only its hover hint changes. Not now just drops the request. A driver who stays in Interact and walks away holds the frame indefinitely (grace only covers people who left). A driver who panned away never sees the request, because it hangs under their Interact button.", "evidence": ["frame-driver.tsx:63-104, 128-151", "lib/canvas/frame-control.ts:15-26, 33, 97-105, 165-168", "guides/frames.mdx:161-178", "Hosted only; read in code, not captured"], "fix": "A visible asked state on the asker’s button; a toast “Ana said not now” on decline; when the driver’s bar is off screen, show the request as a toast with Give control / Not now.", "call": {"q": "What happens when the person in control walks away?", "options": [{"id": "A", "label": "Leave it"}, {"id": "B", "label": "Pass control after N idle minutes"}, {"id": "C", "label": "Canvas owner can always take control"}]}, "related": "H6 (merged here)", "pend": {"tag": "May change", "why": "Control and Interact stay as they are in the rethink, so this likely survives. Check once R3 settles where requests show, since the toggle replaces Detach in the same bar."}}, {"id": "P8", "sev": "med", "title": "Deleting a chat leaves mockups and documents no agent can change again", "wrong": "Delete chat removes its frames and workspace but not the mockups and documents it made. Only the owning chat may write them, so every other chat refuses from then on, and “Ask the agent to add a knob” disappears. The dialog doesn’t mention them.", "evidence": ["lib/canvas/ops.ts:1068-1091", "lib/agent/mockup-tools.ts:96, 116; document-tools.ts:52 (owner-only)", "lib/canvas/document-owner.ts:14-17, 36-41", "delete-branch-dialog.tsx:83-86"], "fix": "Depends on the call.", "call": {"q": "What happens to mockups and documents when their chat is deleted?", "options": [{"id": "A", "label": "Any chat can edit them", "rec": true}, {"id": "B", "label": "Delete them with the chat"}, {"id": "C", "label": "Read-only, said in the dialog"}]}}, {"id": "P9", "sev": "low", "title": "Inside a workspace chat, nothing says another chat needs you", "wrong": "The orange dot lives only on the Chats button, which only the Coordinator header has. The “Coordinator /” crumb shows nothing. P2 makes this worse.", "evidence": ["chats-menu.tsx:645-650", "chat-panel.tsx:213-231"], "fix": "Show the needs-you dot after the Coordinator crumb when another chat needs you.", "call": {"q": "Show the needs-you dot after the Coordinator crumb?", "options": [{"id": "A", "label": "Dot after the crumb", "rec": true}, {"id": "B", "label": "Keep as is"}]}, "related": "H4"}, {"id": "P10", "sev": "med", "title": "Hosted: Your other repositories offers Add for one a teammate already added, giving two “web” rows", "wrong": "Rows match by each person’s repository id, not by remote, so adding Ben’s acme/web beside Ana’s makes a second Repo with the same short name. New chat’s picker and the Chats rows then show “web” twice.", "evidence": ["lib/repository-library/canvas.ts:336-346", "canvas-settings-dialog.tsx:369-370", "CONTEXT.md allows two Repos of one repository only with different names"], "fix": "Depends on the call.", "call": {"q": "A teammate already added the same repository. What does Add do?", "options": [{"id": "A", "label": "Hide the duplicate", "rec": true}, {"id": "B", "label": "Merge into their row"}, {"id": "C", "label": "Allow it with a warning"}]}, "related": "H5"}, {"id": "P11", "sev": "med", "title": "Tool rows say “Driving / Drove”, 38 minutes after the copy sweep switched frame takeover to “control”", "wrong": "PR #1468 added Driving/Drove rows after PR #1456 set the steps to Take control and Give back control. The docs now document “Drove”, and the copy lint can’t catch it.", "evidence": ["components/agent/agent-message.tsx:1101-1102 (#1468) vs :222, :233 (#1456)", "guides/agent.mdx:271, 282-285", "lib/ui-copy/rules.ts:15-31"], "fix": "Whichever wording wins, add the banned word to rules.ts.", "call": {"q": "What do tool rows say when the agent used a frame?", "options": [{"id": "A", "label": "Keep “Drove”"}, {"id": "B", "label": "“Used <page>”"}, {"id": "C", "label": "“Showed / Set up <page>”"}]}}, {"id": "P12", "sev": "low", "title": "Settings’ repository dialog describes hosted behaviour on desktop", "wrong": "It says edits are “applied when you add it to a canvas”. On desktop, sa (()=>{

 const open=FINDINGS.filter(f=>!state.picks[f.id]),stands=open.filter(f=>!f.call||recOf(f)),asks=open.filter(f=>f.call&&!recOf(f));
 if(stands.length)L.push("Unpicked, recommendation stands: "+stands.map(f=>f.call?`${f.id} (${recOf(f).id})`:f.id).join(", "));
 if(asks.length)L.push("Unanswered calls with no recommendation: "+asks.map(f=>f.id).join(", "));
 const notes=FINDINGS.filter(f=>(state.notes[f.id]||"").trim());
 if(notes.length){L.push("Notes:");notes.forEach(f=>L.push(`  ${f.id}: ${state.notes[f.id].trim()}`))}
 if(state.note.trim())L.push("Note: "+state.note.trim());
 return L.join("\n");
}
function sync(){
 const n=v=>FINDINGS.filter(f=>state.picks[f.id]===v).length;
 const fix=FINDINGS.filter(f=>state.picks[f.id]&&state.picks[f.id]!=="skip").length,left=FINDINGS.filter(f=>!state.picks[f.id]).length;
 $("tally").innerHTML=`<b>${fix}</b> picked · <b>${n("skip")}</b> skipped · ${calls.filter(f=>state.picks[f.id]).length} of ${calls.length} calls · ${left} left`;
 document.querySelectorAll(".choose button[data-v]").forEach(b=>b.setAttribute("aria-pressed",state.picks[b.dataset.f]===b.dataset.v));
 save();
}
document.addEventListener("click",e=>{
 const b=e.target.closest(".choose button[data-v]");
 if(b){const k=b.dataset.f;state.picks[k]=state.picks[k]===b.dataset.v?undefined:b.dataset.v;if(!state.picks[k])delete state.picks[k];sync();return}
 const nb=e.target.closest("button[data-note]");
 if(nb){const t=document.querySelector(`.fnote[data-f="${CSS.escape(nb.dataset.note)}"]`);t.hidden=!t.hidden;if(!t.hidden)t.focus();return}
 const tab=e.target.closest(".tabs button");
 if(tab){const k=tab.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===tab));
  document.querySelectorAll(".finding").forEach(c=>c.hidden=!(k==="all"||(k==="calls"?c.dataset.call==="1":c.dataset.depth===k)));
  document.querySelectorAll("[data-depth-head]").forEach(h=>h.hidden=!(k==="all"||h.dataset.depthHead===k));scrollTo({top:0});return}
 const s=e.target.closest(".shot");
 if(s){const dark=getComputedStyle(s.querySelector(".lt")).display==="none";$("lb").querySelector("img").src=dark&&s.dataset.dk?s.dataset.dk:s.dataset.lt;$("lb").showModal();return}
 if(e.target.closest("#lb"))$("lb").close();
});
document.querySelectorAll(".fnote").forEach(t=>{t.value=state.notes[t.dataset.f]||"";if(t.value)t.hidden=false;t.addEventListener("input",()=>{state.notes[t.dataset.f]=t.value;save()})});
$("noteBtn").addEventListener("click",()=>{const n=$("note");n.hidden=!n.hidden;if(!n.hidden)n.focus()});
$("note").value=state.note;if(state.note)$("note").hidden=false;
$("note").addEventListener("input",e=>{state.note=e.target.value;save()});
$("copy").addEventListener("click",()=>{
 const text=build(),b=$("copy"),done=t=>{b.textContent=t;setTimeout(()=>b.textContent="Copy picks",1800)};
 const fallback=()=>{const o=$("out");o.hidden=false;o.value=text;o.select();done("Select and copy")};
 try{navigator.clipboard.writeText(text).then(()=>done("Copied"),fallback)}catch(e){fallback()}
});
// Light / Dark switch, so the other theme's captures are one tap away
const root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":mq.matches;
const tl=()=>$("theme").textContent=isDark()?"Light":"Dark";
$("theme").addEventListener("click",()=>{root.dataset.theme=isDark()?"light":"dark";tl()});tl();
sync();
})();
</script>

</body></html>
