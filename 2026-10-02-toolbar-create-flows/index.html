<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Toolbar create flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. The question, a round toggle, Today (captures + per-tool flows), then each option as a toolbar strip, storyboards and a flow table, then the reaction form. Screenplay brand: Unbounded titles, Instrument Sans UI. */
:root{--bg:#f6f6f5;--surface:#ececea;--card:#ffffff;--line:#dcdcd8;--fg:#121212;--muted:#5f5f5a;--accent:#3b4cf0;--ok:#16824a;--no:#b8342a;--hi:#ff7a1a;
--sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--head:"Unbounded","Instrument Sans",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--surface:#1a1a1a;--card:#121212;--line:#2f2f2d;--fg:#f2f2f0;--muted:#a2a29d;--accent:#8b97ff;--ok:#5fd08e;--no:#f08a7c;--hi:#ff9a4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0b;--surface:#1a1a1a;--card:#121212;--line:#2f2f2d;--fg:#f2f2f0;--muted:#a2a29d;--accent:#8b97ff;--ok:#5fd08e;--no:#f08a7c;--hi:#ff9a4d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:40px 120px;display:flex;flex-direction:column;gap:44px}
.lbl{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl.acc{color:var(--accent)}
h1{font:600 clamp(22px,4vw,30px)/1.2 var(--head);letter-spacing:-.01em;margin:10px 0 14px;text-wrap:balance}
h2{font:500 clamp(17px,2.2vw,20px)/1.3 var(--head);margin:0;text-wrap:balance}
h3{font:600 16px/1.35 var(--sans);margin:0}
p{margin:0}
a{color:var(--accent)}
blockquote{margin:0;padding-left:14px;border-left:2px solid var(--line);color:var(--muted);max-width:70ch}
.muted{color:var(--muted)}
.rounds{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 13px var(--sans);border-radius:6px;padding:6px 11px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button[aria-pressed="true"],button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:16px}
.shead{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--fg)}
.facts{display:flex;flex-direction:column;gap:6px;max-width:75ch}
.facts li{color:var(--muted)} .facts li b{color:var(--fg);font-weight:500}
.facts code{font:12.5px var(--mono)}
ul{margin:0;padding-left:18px}
.opts{display:flex;flex-direction:column;gap:36px}
.opt{display:flex;flex-direction:column;gap:12px;min-width:0;padding-top:20px;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:0}
.opt header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.letter{font:600 15px var(--head);color:var(--accent)}
.badge{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.badge.rec{color:var(--accent);border-color:currentColor}
.badge.picked{color:var(--ok);border-color:currentColor}
.badge.rejected{color:var(--no);border-color:currentColor}
.opt.rejected .boards{opacity:.55}
.why{max-width:75ch}
.cost{font-size:14px;color:var(--muted);max-width:75ch}
.cost b{font-weight:600;color:var(--fg)}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;align-items:start}
figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:5px}
.shot{border:1px solid var(--line);background:var(--surface);overflow:hidden}
.shot img{display:block;width:100%;height:auto}
.dk{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dk{display:block!important}:root:not([data-theme="light"]) .has-dk .lt{display:none!important}}
:root[data-theme="dark"] .dk{display:block!important}:root[data-theme="dark"] .has-dk .lt{display:none!important}
figcaption{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.boards{display:flex;flex-direction:column;gap:14px}
.board{display:flex;flex-direction:column;gap:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.step svg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.step p{font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:5px}
.step p b{color:var(--fg);font-weight:600}
/* wireframe ink, all from tokens */
.pl{fill:var(--surface)} .cd{fill:var(--card);stroke:var(--line);stroke-width:1}
.ln{stroke:var(--muted);stroke-width:1;fill:none} .ink{fill:var(--fg)} .mt{fill:var(--muted)}
.ic{stroke:currentColor;fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.act{fill:var(--fg)} .acti{color:var(--bg)} .idle{color:var(--fg)}
.new{fill:none;stroke:var(--hi);stroke-width:1.2;stroke-dasharray:3 2}
.dash{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3}
.sel{fill:none;stroke:var(--accent);stroke-width:1.4}
.wt{font:500 7px var(--sans);fill:var(--fg)} .wm{font:400 6.5px var(--sans);fill:var(--muted)} .wh{font:600 8px var(--head);fill:var(--fg)}
.blk{fill:var(--line)}
.hot{fill:var(--hi)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-top:1px solid var(--line)}
thead th{border-top:0;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
td:first-child{font-weight:600;white-space:nowrap}
td.chg{box-shadow:inset 2px 0 var(--hi)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.key i{display:inline-block;width:18px;height:10px;vertical-align:middle;margin-right:6px}
.key .k1{border:1.2px dashed var(--hi)} .key .k2{box-shadow:inset 2px 0 var(--hi);background:var(--surface)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer}
.pick:hover,.pick:has(input:checked){background:var(--surface)}
.pick input{margin:3px 0 0;accent-color:var(--accent)}
textarea{width:100%;font:14px/1.5 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;resize:vertical;min-height:60px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13px;color:var(--ok)}
pre.out{white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:6px;margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
<header>
<p class="lbl acc">Design exploration · 2 Oct 2026</p>
<h1 id="q"></h1>
<blockquote id="quote"></blockquote>
</header>

<nav class="rounds" id="rounds" aria-label="Rounds"></nav>

<section id="today"></section>
<section id="round"></section>

<section id="react">
<div class="shead"><p class="lbl">Your reaction</p><h2 id="reactTitle"></h2><p class="muted">Pick one, or say what's missing. Copy the text and paste it back in the chat.</p></div>
<form id="form"></form>
<div class="row"><button type="button" id="copy" class="primary">Copy reaction</button><span class="status" id="status" role="status" aria-live="polite"></span></div>
<pre class="out" id="preview"></pre>
</section>
</div>

<script>
/* ---------- wireframe kit (SVG, 200x130 per step, coloured from tokens) ---------- */
const IC={
 sel:'<path class="ic" d="M-3 -4 L-3 4 L-0.8 1.9 L1 5 L2.2 4.4 L0.4 1.3 L3.4 1.1 Z"/>',
 frame:'<path class="ic" d="M-4 -1.5V-4H-1.5M1.5 -4H4V-1.5M4 1.5V4H1.5M-1.5 4H-4V1.5"/>',
 mock:'<rect class="ic" x="-4" y="-4" width="8" height="8" rx="1"/><path class="ic" d="M-4 1.5 L-1 -1 L1.5 1 L4 -1.2"/>',
 doc:'<path class="ic" d="M-3 -4.5H1.2L3.5 -2.2V4.5H-3Z M-1.4 0.3H1.9 M-1.4 2.3H1.9"/>',
 com:'<path class="ic" d="M-4 -3.5H4V2.2H-0.8L-3 4.3V2.2H-4Z"/>',
 make:'<path class="ic" d="M0 -4.5 L1.1 -1.1 L4.5 0 L1.1 1.1 L0 4.5 L-1.1 1.1 L-4.5 0 L-1.1 -1.1Z"/>'
};
const TB=(x,y,tools,active,nw=[])=>{ // floating toolbar pill centred on x
 const w=tools.length*14+6,x0=x-w/2;
 return `<rect class="cd" x="${x0}" y="${y}" width="${w}" height="18" rx="3"/>`+tools.map((t,i)=>{
  const cx=x0+3+7+i*14,on=t===active,isNew=nw.includes(t);
  return `${on?`<rect class="act" x="${cx-6}" y="${y+3}" width="12" height="12" rx="2"/>`:""}${isNew?`<rect class="new" x="${cx-6.5}" y="${y+2.5}" width="13" height="13" rx="2"/>`:""}<g transform="translate(${cx} ${y+9})" class="${on?"acti":"idle"}">${IC[t]}</g>`}).join("");
};
const T=(x,y,s,c="wt",a="start")=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
const R=(x,y,w,h,c="cd",rx=2)=>`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
const CUR=(x,y)=>`<path class="ink" d="M${x} ${y} l0 9 l2.4 -2.2 l1.7 3.4 l1.3 -.6 l-1.7 -3.3 l3.3 -.2 Z"/>`;
const COMPOSER=(x,y,w,ph,target)=>R(x,y,w,22,"cd",3)+T(x+5,y+9,ph,"wm")+(target?`${R(x+4,y+13,target.length*3.4+8,7,"pl",2)}${T(x+8,y+18.5,target,"wm")}`:"")+`<circle class="ink" cx="${x+w-7}" cy="${y+15}" r="3.2"/>`;
const LINES=(x,y,w,n=3)=>Array.from({length:n},(_,i)=>R(x,y+i*6,w*(i===n-1?.6:1),2.4,"blk",1)).join("");
const PAGE=(x,y,w,h)=>R(x+4,y+4,w-8,h*.22,"blk",1)+LINES(x+4,y+h*.35,w-8,3);
const SPIN=(x,y)=>`<circle class="ln" cx="${x}" cy="${y}" r="3.2" stroke-dasharray="12 8"/>`;
const PANEL=(lines)=>R(150,0,50,130,"cd",0)+T(154,10,"Coordinator","wm")+lines;
const svg=inner=>`<svg viewBox="0 0 200 130" role="img" aria-hidden="true"><rect class="pl" x="0" y="0" width="200" height="130"/>${inner}</svg>`;
const S=(draw,cap)=>({draw,cap});

/* ---------- content ---------- */
const QUESTION={
 quote:"lets do some design thinking on whether or not even being able to create smth w/ the toolbar makes sense, it kinda doesn't but kinda does? like what is the expected user flow when making smth from the toolbar for each thing, should mockup be on the toolbar? what if u drew a rect for a mockup and then it asked for a prompt immediately? idk",
 q:"What should drawing something from the toolbar do for each kind of layer, and which kinds belong there?",
 slug:"toolbar-create-flows"
};
const IMG=(p,cap,dk)=>({p,cap,dk});
const TODAY={
 facts:[
  "<b>Toolbar:</b> Select (V), Frame (F), Document (D), and Comment (C) on web only. It is the shared floating toolbar, bottom centre (<code>components/canvas/canvas-toolbar.tsx:38</code>). No Mockup tool.",
  "<b>Frame:</b> click or drag places an empty frame (click gives the default size, drag sets it) that says \"No Workspace. Choose a Workspace from the frame's title\" (<code>use-draw-tool.ts:160</code>, <code>frame-status.tsx:40</code>). It can only show a Workspace that already exists. Nothing starts.",
  "<b>Document:</b> click or drag places a blank Document already in edit mode (480×640 on a click). It has no owner, and Send to agent goes to the foreground chat. This is the one tool that makes something whole by hand.",
  "<b>Comment:</b> places a comment thread (web only). Also a complete act by hand.",
  "<b>Mockup:</b> only a chat makes one, through <code>create_mockup</code>. It lands beside that chat's other layers, and the tool takes a size but no position (<code>lib/agent/mockup-tools.ts:48</code>). <code>createMockup</code> already accepts an <code>anchor</code> (<code>lib/canvas/ops.ts:966</code>).",
  "<b>Chats:</b> every chat gets exactly one Workspace when it starts. Chats start from the Coordinator composer, Chats menu, New chat, or the prompt-first New Workspace dialog. The Coordinator places layers, and a chat's frame appears when its Workspace boots.",
  "<b>Another view of a running Workspace:</b> Duplicate on the frame menu, or the Group's trailing + while Frame is armed."
 ],
 shots:[IMG("today/toolbar.light.png","Today · toolbar (local build)","today/toolbar.dark.png"),IMG("today/nw.light.png","Today · a drawn frame","today/nw.dark.png"),IMG("today/emptyc.light.png","Today · empty canvas","today/emptyc.dark.png"),IMG("today/armed.light.png","Today · F pressed","today/armed.dark.png")],
 flows:[["Frame","Place an empty box, open its title, pick an existing Workspace. A dead end if none fits; to get new work you leave the canvas for chat."],["Document","Place it and type. Complete."],["Comment","Place it and type. Complete (web)."],["Mockup","Not on the toolbar. Ask a chat in words; it chooses size and place."]]
};

const CANVAS_BG=`${R(10,14,54,40)}${PAGE(12,16,50,36)}${T(10,11,"Checkout","wm")}${R(72,14,54,40)}${PAGE(74,16,50,36)}${T(72,11,"Empty cart","wm")}`;

const ROUNDS=[
{n:3,feedback:"Zack: \"yea lets do a round really honing in on how this looks and feels.\" Settled so far: drawing a Frame or a Mockup opens an ask card centred on the box at UI scale. Its chip shows who answers, the selected layer's chat or else a new chat. Esc on an empty Mockup prompt removes the box. A frame left unanswered shows the No Workspace screen with a Start a chat button. These are real captures of the app with the card injected; this round is only about the card's look.",
 shared:[IMG("r3/U-today.light.png","Today · an unanswered frame","r3/U-today.dark.png"),IMG("r3/U-after.light.png","All options · plus Start a chat, which reopens the card","r3/U-after.dark.png")],
 options:[
 {id:"A",name:"Mini composer",rec:true,
  tools:["sel","frame","mock","doc","com"],nw:["mock"],boards:[],
  shots:[IMG("r3/A-frame.light.png","Frame · new chat","r3/A-frame.dark.png"),IMG("r3/A-mockup.light.png","Mockup · Empty cart selected, so its chat answers","r3/A-mockup.dark.png")],
  why:"The chat composer itself, lifted onto the floating surface: the same field, the chip where the model pill sits, and the same Send button. Nothing new to learn, it grows for a long prompt, and the chip has room to read in full. It's the closest match to how chat already looks.",
  cost:"The biggest of the three, so it covers the most of the box's neighbours while it's open. In dark mode it reads as a black card with only its outline, the same as the panel composer.",
  flows:[["Frame","Card = the composer (field above, chip and Send below).",1],["Mockup","Same card; the chip names the selected layer's chat.",1],["Document","Unchanged."],["Comment","Unchanged (web)."]]},
 {id:"B",name:"One-line bar",
  tools:["sel","frame","mock","doc","com"],nw:["mock"],boards:[],
  shots:[IMG("r3/B-frame.light.png","Frame · new chat","r3/B-frame.dark.png"),IMG("r3/B-mockup.light.png","Mockup · Empty cart selected","r3/B-mockup.dark.png")],
  why:"The floating toolbar's shell holding one line: prompt, chip, Send. It's the lightest and covers the least, and it sits in the same family as the toolbar and frame bar, like Figma's or tldraw's inline prompt.",
  cost:"A one-line field is cramped for anything but a short ask, and a long chip name squeezes the prompt. Growing to more lines needs a rule for when it turns into A.",
  flows:[["Frame","Card = one line: prompt, chip, Send.",1],["Mockup","Same bar; the chip names the selected layer's chat.",1],["Document","Unchanged."],["Comment","Unchanged (web)."]]},
 {id:"C",name:"Composer with a header",
  tools:["sel","frame","mock","doc","com"],nw:["mock"],boards:[],
  shots:[IMG("r3/C-frame.light.png","Frame · header shows what and the size","r3/C-frame.dark.png"),IMG("r3/C-mockup.light.png","Mockup · Empty cart selected","r3/C-mockup.dark.png")],
  why:"A's composer under a small header that says what you're making and its size (\"New frame · 390 × 844\") with an Esc key on the right. It confirms the box became a viewport and says how to back out.",
  cost:"The tallest card, and the header repeats what the box and toolbar already show. The size can be off the dashed box's own label instead.",
  flows:[["Frame","Card = header (New frame · size, Esc) over the composer.",1],["Mockup","Same card, header says New mockup.",1],["Document","Unchanged."],["Comment","Unchanged (web)."]]}
]},
{n:2,feedback:"Zack: \"i like a combo of B + D?\" Carried into this round: Frame and a new Mockup tool are on the toolbar. Drawing either asks for a prompt right away, and what you ask for fills the box. A frame you leave unanswered stays, and its body keeps asking the way D's does: show a Workspace, or start a chat. A Mockup box you leave unanswered is removed, since there is nothing to show. The question this round: where does the ask live?",options:[
 {id:"A",name:"Ask in the box",state:"rejected",
  tools:["sel","frame","mock","doc","com"],nw:["mock"],
  why:"The box's own body is the ask, from the moment you let go: a Workspace list on top and a focused composer under it. It's the same surface while you draw it and later, so there's one thing to learn. Mockup boxes show only the composer, since a Mockup can't show a Workspace.",
  cost:"The ask scales with the canvas. At 25% zoom it's unreadable, and a phone-sized box is too narrow for the list and the composer. It needs a zoom-to-box on draw, or a minimum size.",
  boards:[{title:"Draw, ask, leave",steps:[
   S(svg(CANVAS_BG+`<rect class="dash" x="20" y="64" width="80" height="42" rx="3"/>`+CUR(100,105)+TB(150,108,["sel","frame","mock","doc","com"],"frame",["mock"])),"<b>Drag a box</b> with F."),
   S(svg(CANVAS_BG+R(20,64,80,42)+T(24,72,"Show a Workspace","wm")+R(24,74,72,6,"pl",1)+T(27,78.5,"Checkout","wm")+COMPOSER(24,82,72,"Start a chat…","New chat")+TB(150,108,["sel","frame","mock","doc","com"],"frame",["mock"])),"<b>The body asks</b>, composer focused."),
   S(svg(CANVAS_BG+R(20,64,80,42)+T(24,72,"Show a Workspace","wm")+R(24,74,72,6,"pl",1)+T(27,78.5,"Checkout","wm")+COMPOSER(24,82,72,"Start a chat…")+T(20,61,"Untitled frame","wm")+TB(150,108,["sel","frame","mock","doc","com"],"sel",["mock"])),"<b>Click away</b> and nothing changes. It's still asking."),
  ]}],
  flows:[["Frame","Draw it, and the box body asks (list + composer). Answer now or later, in the same place.",1],["Mockup","Draw it, and the box body is a composer. Esc on empty removes the box.",1],["Document","Unchanged."],["Comment","Unchanged (web)."]]
 },
 {id:"B",name:"Ask under the box",state:"rejected",
  tools:["sel","frame","mock","doc","com"],nw:["mock"],
  why:"When you let go, a composer card appears at screen size in the slot under the box, where the frame bar sits for a selected frame (the same portal, iframe-layer.tsx:529). It's readable at any zoom and doesn't depend on the box size. A Show a Workspace button in the card opens D's list. If you click away, the card goes, and the frame's body shows D's empty state: the Workspace list plus a Start a chat button that brings the card back.",
  cost:"A new card in the frame-bar slot, on the shared floating surface. The list appears in two places (the card's menu and the empty body), and both use the existing WorkspaceCommandList. For a Mockup, the card has no Show button.",
  boards:[{title:"Draw, ask, leave",steps:[
   S(svg(CANVAS_BG+`<rect class="dash" x="20" y="64" width="40" height="44" rx="3"/>`+CUR(60,107)+TB(150,108,["sel","frame","mock","doc","com"],"frame",["mock"])),"<b>Drag a box</b>, any size."),
   S(svg(CANVAS_BG+`<rect class="dash" x="20" y="62" width="40" height="38" rx="3"/>`+COMPOSER(10,104,100,"What should this be?","New chat")+R(70,116,24,7,"blk",2)+T(72,121.5,"Show ⌄","wm")),"<b>A card opens under it</b>, at screen size."),
   S(svg(CANVAS_BG+R(20,64,48,44)+T(23,72,"Show","wm")+T(25,81,"Checkout","wm")+T(25,89,"Empty cart","wm")+R(23,95,42,9,"cd",2)+T(44,101.5,"Start a chat","wm","middle")+T(20,61,"Untitled frame","wm")+TB(150,108,["sel","frame","mock","doc","com"],"sel",["mock"])),"<b>Click away:</b> D's empty frame, with Start a chat to reopen the card."),

/* ---------- render ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const shots=list=>list&&list.length?`<div class="shots">`+list.map(i=>`<figure><div class="shot${i.dk?" has-dk":""}"><img class="lt" src="${i.p}" alt="${esc(i.cap)}" loading="lazy">${i.dk?`<img class="dk" src="${i.dk}" alt="" aria-hidden="true" loading="lazy">`:""}</div><figcaption>${esc(i.cap)}</figcaption></figure>`).join("")+`</div>`:"";
const flowTable=rows=>`<div class="tblw"><table><thead><tr><th>Tool</th><th>What drawing it does</th></tr></thead><tbody>`+rows.map(([k,v,c])=>`<tr><td>${esc(k)}</td><td class="${c?"chg":""}">${esc(v)}</td></tr>`).join("")+`</tbody></table></div>`;
const toolbarStrip=(tools,nw)=>`<figure><div style="max-width:220px">${`<svg viewBox="0 0 ${tools.length*14+16} 26" role="img" aria-label="Toolbar: ${tools.join(", ")}" style="display:block;width:100%;height:auto">`+TB((tools.length*14+16)/2,4,tools,"sel",nw)+`</svg>`}</div><figcaption>Toolbar</figcaption></figure>`;
const KEY="exploration-"+QUESTION.slug;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let current=ROUNDS[0].n;

$("q").textContent=QUESTION.q;$("quote").textContent=QUESTION.quote;
$("today").innerHTML=`<div class="shead"><p class="lbl">Today</p><h2>What main does now</h2></div><ul class="facts">${TODAY.facts.map(f=>`<li>${f}</li>`).join("")}</ul>`+shots(TODAY.shots)+`<p class="lbl" style="margin-top:6px">Flow per tool, today</p>`+flowTable(TODAY.flows)+
 `<p class="muted" style="max-width:75ch">Read: Document and Comment make sense on the toolbar because a person finishes them by hand. Frame and Mockup are filled by a model, so a drawn box has nothing to fill it. That's the \"kinda doesn't\". The options differ on whether drawing should start the model.</p>`;
$("rounds").innerHTML=`<span class="lbl">Round</span>`+ROUNDS.map(r=>`<button type="button" data-n="${r.n}">${r.n}${r===ROUNDS[0]?" · latest":""}</button>`).join("");
$("rounds").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(b){current=+b.dataset.n;render()}});

function render(){
 const r=ROUNDS.find(x=>x.n===current),latest=r===ROUNDS[0];
 $("rounds").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===current)));
 $("round").innerHTML=`<div class="shead"><p class="lbl">Round ${r.n}</p><h2>${r.options.length} options</h2>${r.feedback?`<blockquote>${esc(r.feedback)}</blockquote>`:""}${r.shared?shots(r.shared):""}<div class="key"><span><i class="k1"></i>new on the toolbar</span><span><i class="k2"></i>changed from today</span><span>Storyboards are wireframes; the Coordinator panel is the strip on the right.</span></div></div><div class="opts">`+
  r.options.map(o=>`<article class="opt ${o.state||""}" id="r${r.n}-${o.id}"><header><span class="letter">${o.id}</span><h3>${esc(o.name)}</h3>${o.rec?'<span class="badge rec">Recommended</span>':""}${o.state?`<span class="badge ${o.state}">${o.state==="picked"?"Picked":"Rejected"}</span>`:""}</header>`+
  toolbarStrip(o.tools,o.nw)+
  shots(o.shots)+`<div class="boards">${(o.boards||[]).map(b=>`<div class="board"><p class="lbl">${esc(b.title)}</p><div class="steps">${b.steps.map(s=>`<div class="step">${s.draw}<p>${s.cap}</p></div>`).join("")}</div></div>`).join("")}</div>`+
  `<p class="why">${esc(o.why)}</p>`+flowTable(o.flows)+`<p class="cost"><b>Cost</b> ${esc(o.cost)}</p></article>`).join("")+`</div>`;
 $("react").hidden=!latest;
 if(latest)renderForm(r);
}
function renderForm(r){
 $("reactTitle").textContent=`Round ${r.n}`;
 const opts=r.options.map(o=>[o.id,`${o.id}: ${o.name}${o.rec?" (recommended)":""}`]).concat([["none","None of these"],["mix","A mix (say which parts below)"]]);
 $("form").innerHTML=`<fieldset><legend>Pick</legend>`+opts.map(([v,l])=>`<label class="pick"><input type="radio" name="pick" id="pick-${v}" value="${v}"><span>${esc(l)}</span></label>`).join("")+`</fieldset>`+
  `<p class="lbl" style="margin-top:12px">Notes</p><textarea id="note" aria-label="Notes"></textarea>`;
 if(saved.round===r.n){const el=$("pick-"+saved.pick);if(el)el.checked=true;$("note").value=saved.note||""}
 preview();
}
function build(){
 const r=ROUNDS[0],p=$("form").querySelector("input[name=pick]:checked"),note=$("note").value.trim();
 const o=p&&r.options.find(x=>x.id===p.value);
 const pick=!p?"No pick yet":o?`${o.id}: ${o.name}`:p.value==="none"?"None of these":"A mix";
 return[`Exploration: ${QUESTION.q}`,`Round ${r.n}`,`→ ${pick}`].concat(note?[`Note: ${note}`]:[]).join("\n");
}
function preview(){
 $("preview").textContent=build();
 const p=$("form").querySelector("input[name=pick]:checked");
 try{localStorage.setItem(KEY,JSON.stringify({round:ROUNDS[0].n,pick:p?p.value:"",note:$("note").value}))}catch(e){}
}
$("form").addEventListener("input",preview);
$("form").addEventListener("submit",e=>e.preventDefault());
$("copy").addEventListener("click",()=>{
 const text=build(),st=$("status");
 const fallback=()=>{const p=$("preview"),r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);st.textContent="Copy was blocked. The text is selected; copy it by hand."};
 try{navigator.clipboard.writeText(text).then(()=>{st.textContent="Copied. Paste it in the chat."},fallback)}catch(e){fallback()}
});
render();
</script>
