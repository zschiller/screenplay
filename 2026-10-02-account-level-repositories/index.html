<style>

<div class="wrap">
<header>
<p class="lbl acc">Design exploration · 2 Oct 2026 · desktop and hosted</p>
<h1 id="q"></h1>
<blockquote id="quote"></blockquote>
</header>

<nav class="rounds" id="rounds" aria-label="Rounds"></nav>

<section id="today"></section>
<section id="round"></section>

<section id="react">
<div class="shead"><p class="lbl">Your reaction</p><h2 id="reactTitle"></h2><p class="muted">Pick one, or say what's missing. Copy the text and paste it back in the chat.</p></div>
<form id="form"></form>
<div class="row"><button type="button" id="copy" class="primary">Copy reaction</button><span class="status" id="status" role="status" aria-live="polite"></span></div>
<pre class="out" id="preview"></pre>
</section>
</div>

<script>
const IMG=(p,cap,dk)=>({p,cap,dk});
const WF=(cap,html)=>({cap,wf:`<div class="wf">${html}</div>`});
const row=(name,sub,right)=>`<div class="r"><span class="nm"><b>${name}</b>${sub?`<i>${sub}</i>`:""}</span>${right||""}</div>`;
const tag=(t,n)=>`<span class="tag${n?" n":""}">${t}</span>`;
const btn=(t,k)=>`<span class="b${k?" "+k:""}">${t}</span>`;
const EDIT=btn("Edit")+btn("⋯");
const QUESTION={
 quote:"Zack: \"it just feels a little weird on the desktop ver. to have to 'add a repo' i already configured\" … \"we need to explore what that looks like\" … \"in both the canvas and in the settings\"",
 q:"How do Settings and the Canvas show repositories that now live on your account?",
 slug:"account-repos-desktop"
};
const TODAY={facts:"Settings › Repository presets lists saved presets (Edit, ⋯, New preset) that are \"applied when you add it to a canvas\". Canvas settings › Repositories lists that canvas's own copies with Add repository. The add picker shows presets first, then GitHub repositories. The copy is one-way, so editing either never updates the other. Agreed already: on desktop, canvas copies link to your account repository, edits update every canvas, and deleting in Settings leaves canvases an unlinked copy. Hosted is unchanged.",shots:[
 IMG("today/settings-presets-light.png","Today · Settings › Repository presets","today/settings-presets-dark.png"),
 IMG("today/canvas-settings-light.png","Today · Canvas settings › Repositories","today/canvas-settings-dark.png"),
 IMG("today/add-project-github-light.png","Today · Add repository picker","today/add-project-github-dark.png")]};

const SETTINGS=`<span class="t">Repositories</span><span class="sub">Your repositories and how to run them. Canvases that use one stay in sync.</span>
<div class="list">${row("acme/storefront","pnpm install · pnpm dev",tag("3 canvases")+EDIT)}${row("acme/web","npm ci · npm run dev",tag("1 canvas")+EDIT)}${row("acme/design-system","pnpm install · pnpm storybook",tag("No canvases")+EDIT)}</div>
<div class="foot">${btn("+ New repository")}</div>`;
const DELETE=`<span class="t">Delete acme/storefront?</span><span class="sub">It's on 3 canvases. They keep their copy, but it stops getting your edits.</span><div class="foot">${btn("Cancel","g")}${btn("Delete","p")}</div>`;
const EDITFORM=(where)=>`<span class="crumb">${where}</span><span class="t">storefront</span><span class="field">pnpm install</span><span class="field">pnpm dev --port $PORT</span><div class="note">Saving updates storefront on 3 canvases.</div><div class="foot">${btn("Cancel","g")}${btn("Save","p")}</div>`;


const SETTINGS2=`<span class="t">Repositories</span><span class="sub">Your repositories and how to run them.</span>
<div class="list">${row("acme/storefront","pnpm install · pnpm dev",EDIT)}${row("acme/web","npm ci · npm run dev",EDIT)}${row("acme/design-system","pnpm install · pnpm storybook",EDIT)}</div>
<div class="foot">${btn("+ New repository")}</div>`;
const SW=(on,extra)=>(extra||"")+btn("Edit","g")+`<span class="sw${on?" on":""}"></span>`;
const CANVAS2=(rows,sub)=>`<span class="crumb">Canvas settings / Repositories</span><span class="sub">${sub||"Turn on the repositories this canvas uses."}</span><div class="list">${rows}</div><div class="foot">${btn("+ New repository")}</div>`;
const FORM=(crumb,note,foot)=>`<span class="crumb">${crumb}</span><span class="t">storefront</span><span class="field">pnpm install</span><span class="field">pnpm dev --port $PORT</span>${note?`<div class="note">${note}</div>`:""}<div class="foot">${foot}</div>`;

const CK=(t,on)=>`<span class="chk"><span class="ck"${on?' style="background:var(--fg)"':""}></span>${t}</span>`;
const F3=(crumb,mid,foot)=>`<span class="crumb">${crumb}</span><span class="t">storefront</span><span class="field">pnpm install</span><span class="field">pnpm dev --port $PORT</span>${mid||""}<div class="foot">${foot}</div>`;
const LIST3=CANVAS2(row("acme/storefront","Customized here",btn("Reset","g")+SW(1))+row("acme/web","npm ci · npm run dev",SW(1))+row("acme/design-system","pnpm install · pnpm storybook",SW(0)));
const HOSTED3=(mid,foot)=>F3("Hosted · shared canvas · added by Mia",mid,foot);

const NAMEDOT=n=>`${n}<span class="dot" title="Customized for this canvas"></span>`;
const ROWS4=(first)=>first+row("acme/web","npm ci · npm run dev",SW(1))+row("acme/design-system","pnpm install · pnpm storybook",SW(0));
const FORM4=(foot)=>F3("Canvas settings / Repositories / storefront",CK("Also update Settings and my other canvases"),foot);

const DOTN=n=>`${n}<span class="dot" title="Customized for this canvas"></span>`;
const AV=c=>`<span class="av">${c}</span>`;
const DESK5=(foot,top)=>`<span class="crumb">Canvas settings / Repositories</span><span class="sub">Turn on the repositories this canvas uses.</span>${top||""}<div class="list">${row(DOTN("acme/storefront"),"pnpm install · pnpm dev",SW(1))}${row("acme/web","npm ci · npm run dev",SW(1))}${row("acme/design-system","pnpm install · pnpm storybook",SW(0))}</div>${foot}`;
const HOST5=`<span class="crumb">Hosted · shared canvas</span><div class="list"><span class="sec">On this canvas</span>${row(DOTN("acme/storefront"),"pnpm install · pnpm dev",AV("M")+SW(1))}${row("acme/web","npm ci · npm run dev",AV("Z")+SW(1))}<span class="sec">Your other repositories</span>${row("acme/design-system","pnpm install · pnpm storybook",SW(0))}</div>`;
const SET5=(foot)=>`<span class="t">Repositories</span><span class="sub">Your repositories and how to run them.</span><div class="list">${row("acme/storefront","pnpm install · pnpm dev",EDIT)}${row("acme/web","npm ci · npm run dev",EDIT)}${row("acme/design-system","pnpm install · pnpm storybook",EDIT)}</div>${foot}`;
const PICK5=`<span class="t">New repository</span><span class="field">Search or paste a clone URL…</span><div class="list"><span class="sec">GitHub</span>${row("acme/docs","")}${row("acme/mobile","")}</div><div class="foot">${btn("Open folder…")}</div>`;
const CONF5=`<span class="crumb">New repository / acme/docs</span><span class="t">docs</span><span class="field">pnpm install</span><span class="field">pnpm dev --port $PORT</span><div class="note">Saved to your repositories and turned on for this canvas.</div><div class="foot">${btn("Cancel","g")}${btn("Add","p")}</div>`;
const ROUNDS=[
{n:5,feedback:"Zack picked A with an orange dot, then: \"lets continue the other thing\". Rounds 1–4 settled the canvas list (switches, scripts subtitle, orange customized dot, avatar for who added on hosted) and editing (local, with an unchecked save-to-all box). This round: how a repository you haven't set up yet gets onto your list, from a canvas and from Settings, and what a shared hosted canvas lists.",options:[
 {id:"A",name:"New repository button",rec:true,state:"picked",
  why:"Both lists end with New repository. It opens today's picker (GitHub, clone URL, or a folder on desktop), then today's settings form with detected scripts. Adding from a canvas saves it to your repositories and switches it on there; adding from Settings only saves it. On a shared hosted canvas, the list splits into On this canvas (anyone's, with their avatar) and Your other repositories (switched off).",
  cost:"Closest to today: the picker and form already exist, minus the Repository presets section and the Save as preset checkbox. The hosted split adds two small section labels.",
  shots:[WF("A · Desktop canvas",DESK5(`<div class="foot">${btn("+ New repository")}</div>`)),
   WF("A · Picker",PICK5),WF("A · Settings form",CONF5),
   WF("A · Hosted canvas",HOST5+`<div class="foot">${btn("+ New repository")}</div>`),
   WF("A · Settings › Repositories",SET5(`<div class="foot">${btn("+ New repository")}</div>`))]},
 {id:"B",name:"Search at the top",state:"",
  why:"The canvas list opens with a search field. Typing filters your repositories; below them, matching GitHub repositories appear with an Add button, so finding and adding are one field. Settings gets the same field. Picking a GitHub result opens the settings form, as in A.",
  cost:"A search field is overkill for a list of three or four, and mixing your repositories with GitHub results in one list blurs which ones are set up. New pattern in Canvas settings.",
  shots:[WF("B · Desktop canvas, typing",`<span class="crumb">Canvas settings / Repositories</span><span class="field">doc</span><div class="list"><span class="sec">Your repositories</span>${row("acme/design-system","pnpm install · pnpm storybook",SW(0))}<span class="sec">GitHub</span>${row("acme/docs","",btn("Add"))}</div>`),
   WF("B · Settings form",CONF5)]},
 {id:"C",name:"Settings creates, canvases switch",state:"",
  why:"New repositories are only created in Settings. A canvas list only switches existing ones on and off, and its footer is a link to Settings › Repositories. One place creates, one place uses.",
  cost:"Adding a new repo from a canvas takes a trip to Settings and back, which is the extra step this exploration set out to remove. An empty canvas on a fresh install has nothing to switch on.",
  shots:[WF("C · Desktop canvas",DESK5(`<div class="foot">${btn("Manage in Settings")}</div>`)),
   WF("C · Settings › Repositories",SET5(`<div class="foot">${btn("+ New repository")}</div>`))]}
]},

{n:4,feedback:"Zack: \"i don't love the 'customized here' subtitle maybe a colored dot or something instead?\" … \"i just don't like the way that the subtitle is used in multiple ways\" … \"but seeing who added a repo is important\". Round 3's checkbox is assumed. Each option gives the subtitle one job and shows who added the repo on hosted. Zack picked A with an orange dot (the attention fill) instead of magenta; the shots now show orange.",options:[
 {id:"A",name:"Subtitle is the scripts",rec:true,state:"picked",
  why:"The subtitle always shows how the repository runs (setup · dev), on every row and in both builds. Customized is a small orange dot after the name, with a tooltip. Who added it is an avatar at the start of the row's controls on hosted, with their name on hover; desktop has no avatar, because it's always you. Reset to Settings lives in the edit form's footer.",
  cost:"Reset is inside Edit. The avatar is new on this row, though the app already shows member avatars elsewhere.",
  shots:[WF("A · Desktop canvas",CANVAS2(ROWS4(row(NAMEDOT("acme/storefront"),"pnpm install · pnpm dev",SW(1))))),
   WF("A · Hosted canvas",CANVAS2(row(NAMEDOT("acme/storefront"),"pnpm install · pnpm dev",`<span class="av" title="Added by Mia">M</span>`+SW(1))+row("acme/web","npm ci · npm run dev",`<span class="av" title="Added by you">Z</span>`+SW(1)))),
   WF("A · Hovering",`<div class="list">${row(NAMEDOT("acme/storefront"),"pnpm install · pnpm dev",`<span class="av">M</span>`+SW(1))}</div><span class="tip">Customized for this canvas</span><span class="tip">Added by Mia</span>`),
   WF("A · Edit, with Reset",FORM4(btn("Reset to Settings","g")+btn("Cancel","g")+btn("Save","p")))]},
 {id:"B",name:"Subtitle is who added",state:"",
  why:"On hosted the subtitle always says who added the repository (\"Added by Mia\", \"Added by you\"), and the scripts move into Edit. Customized is the same dot after the name. On desktop, where it's always you, the subtitle is the GitHub name instead (acme/storefront), as Canvas settings shows today.",
  cost:"The subtitle means different things on desktop and hosted, and the run scripts are no longer visible at a glance.",
  shots:[WF("B · Hosted canvas",CANVAS2(row(NAMEDOT("storefront"),"Added by Mia",SW(1))+row("web","Added by you",SW(1)))),
   WF("B · Desktop canvas",CANVAS2(row(NAMEDOT("storefront"),"acme/storefront",SW(1))+row("web","acme/web",SW(1))+row("design-system","acme/design-system",SW(0)))),
   WF("B · Edit, with Reset",FORM4(btn("Reset to Settings","g")+btn("Cancel","g")+btn("Save","p")))]},
 {id:"C",name:"Reset is the marker",state:"",
  why:"The subtitle is the scripts, as in A. No dot: a customized row grows a Reset button next to Edit, and that's the signal. Who added it is the same avatar as A on hosted.",
  cost:"Easy to miss at a glance, the row's controls shift when it becomes customized, and Reset needs a confirm because it's one click from losing changes.",
  shots:[WF("C · Hosted canvas",CANVAS2(row("acme/storefront","pnpm install · pnpm dev",btn("Reset","g")+`<span class="av">M</span>`+SW(1))+row("acme/web","npm ci · npm run dev",`<span class="av">Z</span>`+SW(1)))),
   WF("C · Reset confirm",`<span class="t">Reset storefront?</span><span class="sub">This canvas goes back to Mia's settings for storefront.</span><div class="foot">${btn("Cancel","g")}${btn("Reset","p")}</div>`)]}
]},
{n:3,feedback:"Zack: \"i feel like B but with the option to save to all as well is sort of a middle ground from where we are, and could also genuinely work for the hosted ver. too?\" So: a canvas Edit changes this canvas (Customized here, with Reset), plus a way to save to all. Same design on desktop and hosted. Hosted rule: a canvas copy links to the account of whoever turned it on, so only that person can save to all; a teammate's edit stays on the shared canvas, which is how hosted works today. This round: how Save to all appears.",options:[
 {id:"A",name:"Checkbox under the fields",rec:true,state:"picked",
  why:"One Save button, as today. Under the fields, an unchecked \"Also update Settings and my other canvases\" box. Left alone, the edit stays on this canvas and the row reads Customized here. Checked, it updates your repository in Settings and every canvas that uses it, and clears their customizations. On a shared hosted canvas where someone else turned the repository on, the box is replaced by a line naming who can.",
  cost:"A stock Checkbox in the form. Saving to all overwrites other canvases' customizations, so the checkbox label has to say \"other canvases\" plainly.",

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const shots=list=>list&&list.length&&list[0].wf!==undefined?`<div class="wfs">`+list.map(i=>`<figure>${i.wf}<figcaption>${esc(i.cap)}</figcaption></figure>`).join("")+`</div>`:list&&list.length?`<div class="shots">`+list.map(i=>`<figure><div class="shot${i.dk?" has-dk":""}"><img class="lt" src="${i.p}" alt="${esc(i.cap)}" loading="lazy">${i.dk?`<img class="dk" src="${i.dk}" alt="" aria-hidden="true" loading="lazy">`:""}</div><figcaption>${esc(i.cap)}</figcaption></figure>`).join("")+`</div>`:"";
const KEY="exploration-"+QUESTION.slug;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let current=ROUNDS[0].n;

$("q").textContent=QUESTION.q;$("quote").textContent=QUESTION.quote;
$("today").innerHTML=`<div class="shead"><p class="lbl">Today</p><h2>What main does now</h2><p class="muted">${esc(TODAY.facts)}</p></div>`+shots(TODAY.shots);
$("rounds").innerHTML=`<span class="lbl">Round</span>`+ROUNDS.map(r=>`<button type="button" data-n="${r.n}">${r.n}${r===ROUNDS[0]?" · latest":""}</button>`).join("");
$("rounds").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(b){current=+b.dataset.n;render()}});

function render(){
 const r=ROUNDS.find(x=>x.n===current),latest=r===ROUNDS[0];
 $("rounds").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===current)));
 $("round").innerHTML=`<div class="shead"><p class="lbl">Round ${r.n}</p><h2>${r.options.length} options</h2>${r.feedback?`<blockquote>${esc(r.feedback)}</blockquote>`:""}</div><div class="opts">`+
  r.options.map(o=>`<article class="opt ${o.state}" id="r${r.n}-${o.id}"><header><span class="letter">${o.id}</span><h3>${esc(o.name)}</h3>${o.rec?'<span class="badge rec">Recommended</span>':""}${o.state?`<span class="badge ${o.state}">${o.state==="picked"?"Picked":"Rejected"}</span>`:""}</header>${shots(o.shots)}<p>${esc(o.why)}</p><p class="cost"><b>Cost</b> ${esc(o.cost)}</p></article>`).join("")+`</div>`;
 $("react").hidden=!latest;
 if(latest)renderForm(r);
}
function renderForm(r){
 $("reactTitle").textContent=`Round ${r.n}`;
 const opts=r.options.map(o=>[o.id,`${o.id}: ${o.name}${o.rec?" (recommended)":""}`]).concat([["none","None of these"],["mix","A mix (say which parts below)"]]);
 $("form").innerHTML=`<fieldset><legend>Pick</legend>`+opts.map(([v,l])=>`<label class="pick"><input type="radio" name="pick" id="pick-${v}" value="${v}"><span>${esc(l)}</span></label>`).join("")+`</fieldset>`+
  `<p class="lbl" style="margin-top:12px">Notes</p><textarea id="note" aria-label="Notes"></textarea>`;
 if(saved.round===r.n){const el=$("pick-"+saved.pick);if(el)el.checked=true;$("note").value=saved.note||""}
 preview();
}
function build(){
 const r=ROUNDS[0],p=$("form").querySelector("input[name=pick]:checked"),note=$("note").value.trim();
 const o=p&&r.options.find(x=>x.id===p.value);
 const pick=!p?"No pick yet":o?`${o.id}: ${o.name}`:p.value==="none"?"None of these":"A mix";
 return[`Exploration: ${QUESTION.q}`,`Round ${r.n}`,`→ ${pick}`].concat(note?[`Note: ${note}`]:[]).join("\n");
}
function preview(){
 $("preview").textContent=build();
 const p=$("form").querySelector("input[name=pick]:checked");
 try{localStorage.setItem(KEY,JSON.stringify({round:ROUNDS[0].n,pick:p?p.value:"",note:$("note").value}))}catch(e){}
}
$("form").addEventListener("input",preview);
$("form").addEventListener("submit",e=>e.preventDefault());
$("copy").addEventListener("click",()=>{
 const text=build(),st=$("status");
 const fallback=()=>{const p=$("preview"),r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);st.textContent="Copy was blocked. The text is selected; copy it by hand."};
 try{navigator.clipboard.writeText(text).then(()=>{st.textContent="Copied. Paste it in the chat."},fallback)}catch(e){fallback()}
});
render();
</script>
