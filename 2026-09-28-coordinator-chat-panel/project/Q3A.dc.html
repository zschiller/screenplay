<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breadcrumb back to Canvas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif}
.bd{width:880px;height:600px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#e7e7ea}
.m{--b:#fff;--fg:#0a0a0a;--mu:#737373;--bd:#e5e5e5;--u:#f4f4f5;--p1b:#dbeafe;--p1f:#1d4ed8;width:400px;height:520px;box-sizing:border-box;border:1px solid var(--bd);border-radius:10px;background:var(--b);color:var(--fg);font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.dk{--b:#0a0a0a;--fg:#fafafa;--mu:#a1a1a1;--bd:#262626;--u:#262626;--p1b:#172554;--p1f:#93c5fd}
.hd{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap}
.ic{width:14px;height:14px;color:var(--mu);flex:none}
.i12{width:12px;height:12px;flex:none}
.mu{color:var(--mu)}
.pill{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:500;white-space:nowrap}
.p1{background:var(--p1b);color:var(--p1f)}
.rt{margin-left:auto;display:flex;align-items:center;gap:6px}
.stat{font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;color:var(--mu)}
.btn{font-size:11px;border:1px solid var(--bd);border-radius:6px;padding:1px 7px}
.tabs{height:36px;flex:none;display:flex;gap:14px;padding:0 12px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu)}
.tabs span{display:flex;align-items:center}
.tabs .on{color:var(--fg);box-shadow:inset 0 -1.5px 0 var(--fg)}
.body{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.u{align-self:flex-end;max-width:85%;background:var(--u);border-radius:12px;padding:6px 12px}
.comp{margin:0 12px 12px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px 34px;color:var(--mu);flex:none}
</style>
</helmet>
<div class="bd">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}">
<div class="hd">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M15 3v18"></path></svg>
<a href="Main.dc.html" style="color:var(--mu);text-decoration:none;font-size:13px">Coordinator</a>
<span class="mu">/</span>
<span class="pill p1">Fix sign-in redirect</span>
<svg class="i12 mu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
<div class="rt"><span class="stat">+18 −3</span><span class="btn">Create PR</span></div>
</div>
<div class="tabs"><span class="on">Chat</span><span>+</span></div>
<div class="body">
<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)"><svg class="i12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg><span>Received a message from the Coordinator</span></div>
<div>The callback now returns you to the page you were on. I added a test for it.</div>
</div>
<div class="comp">Ask anything…</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { themes: [{ cls: 'm' }, { cls: 'm dk' }] };
}
}
</script>
</body>
</html>
