<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One status card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif}
.bd{width:880px;height:600px;box-sizing:border-box;padding:40px;display:flex;gap:40px;background:#e7e7ea}
.m{--b:#fff;--fg:#0a0a0a;--mu:#737373;--bd:#e5e5e5;--u:#f4f4f5;--d:rgba(244,244,245,.5);--ok:#16a34a;width:400px;height:520px;box-sizing:border-box;border:1px solid var(--bd);border-radius:10px;background:var(--b);color:var(--fg);font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.dk{--b:#0a0a0a;--fg:#fafafa;--mu:#a1a1a1;--bd:#262626;--u:#262626;--d:rgba(38,38,38,.35);--ok:#4ade80}
.hd{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;border-bottom:1px solid var(--bd)}
.ic{width:14px;height:14px;color:var(--mu);flex:none}
.i12{width:12px;height:12px;flex:none}
.mu{color:var(--mu)}
.t{font-weight:500;font-size:13px}
.stat{font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;color:var(--mu)}
.body{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.u{align-self:flex-end;max-width:85%;background:var(--u);border-radius:12px;padding:6px 12px}
.card{border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column}
.ch{padding:7px 10px;font-size:12px;font-weight:500;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between}
.cr{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:12px}
.cr+.cr{border-top:1px solid var(--bd)}
.comp{margin:0 12px 12px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px 34px;color:var(--mu);flex:none}
</style>
</helmet>
<div class="bd">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}">
<div class="hd">
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M15 3v18"></path></svg>
<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
<span class="t">Canvas</span>
</div>
<div class="body">
<div class="u">Make sign-in send you back where you were, and add a dark mode toggle to Settings.</div>
<div>These are separate, so I started a Workspace for each. I'll tell you when they're done or need you.</div>
<div class="card">
<div class="ch"><span>Workspaces</span><span class="mu" style="font-weight:400">1 of 2 done</span></div>
<div class="cr">
<svg class="i12 mu" viewBox="0 0 12 12" fill="currentColor"><circle cx="2" cy="2" r="1.1"></circle><circle cx="6" cy="2" r="1.1" opacity=".4"></circle><circle cx="10" cy="2" r="1.1" opacity=".4"></circle><circle cx="2" cy="6" r="1.1" opacity=".4"></circle><circle cx="6" cy="6" r="1.1"></circle><circle cx="10" cy="6" r="1.1" opacity=".4"></circle><circle cx="2" cy="10" r="1.1" opacity=".4"></circle><circle cx="6" cy="10" r="1.1" opacity=".4"></circle><circle cx="10" cy="10" r="1.1"></circle></svg>
<span style="flex:1">Fix sign-in redirect</span>
<span class="mu" style="font-size:11px">Working</span>
</div>
<div class="cr">
<svg class="i12" style="color:var(--ok)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
<span style="flex:1">Dark mode toggle</span>
<span class="stat">+42 −8</span>
<span class="mu" style="font-size:11px">Done</span>
</div>
</div>
</div>
<div class="comp">Ask Canvas…</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { themes: [{ cls: 'm' }, { cls: 'm dk' }] };
}
}
</script>
</body>
</html>
