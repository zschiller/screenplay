<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rejoin Without Resizing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column. The question, then a round toggle, then Today and that round's options, then the reaction form and Copy. Swap the tokens below for the repo's brand; the defaults are neutral. */
:root{--bg:#fbfbfa;--surface:#f3f3f1;--line:#e2e2df;--fg:#161615;--muted:#5d5d59;--accent:#c4209c;--ok:#1f7a45;--no:#a3372b;
--sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--head:"Unbounded","Instrument Sans",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#ff5be2;--ok:#5fd08e;--no:#f08a7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--surface:#1b1b1a;--line:#2e2e2c;--fg:#f1f1ef;--muted:#a3a39e;--accent:#ff5be2;--ok:#5fd08e;--no:#f08a7c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:40px 120px;display:flex;flex-direction:column;gap:40px}
.lbl{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl.acc{color:var(--accent)}
h1{font:600 clamp(24px,4.5vw,34px)/1.15 var(--head);letter-spacing:-.02em;margin:10px 0 12px;text-wrap:balance}
h2{font:600 clamp(18px,2.4vw,22px)/1.25 var(--head);margin:0;text-wrap:balance}
h3{font:500 16px/1.35 var(--sans);margin:0}
p{margin:0}
a{color:var(--accent)}
blockquote{margin:0;padding-left:14px;border-left:2px solid var(--line);color:var(--muted);max-width:68ch}
.muted{color:var(--muted)}
.rounds{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 13px var(--sans);border-radius:6px;padding:6px 11px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
.shead{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--fg)}
.opts{display:flex;flex-direction:column;gap:44px}
.opt{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.letter{font:600 14px var(--mono);color:var(--accent)}
.badge{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.badge.rec{color:var(--accent);border-color:currentColor}
.badge.picked{color:var(--ok);border-color:currentColor}
.badge.rejected{color:var(--no);border-color:currentColor}
.opt.rejected .shots{opacity:.55}
.cost{font-size:14px;color:var(--muted)}
.cost b{font-weight:500;color:var(--fg)}
.shots{display:grid;grid-template-columns:1fr;gap:12px}
.shots:has(figure img[src*="zoom"]){grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.shots:has(figure img[src*="zoom"]) figure:has(img[src*="-bar"]){grid-column:1/-1}
.shots figure:has(img[src*="zoom"]),.opt .shots figure:has(img[src*="tooltip"]),.opt .shots figure:has(img[src*="menu"]),.opt .shots figure:has(img[src*="frame"]){max-width:560px}
.shots.pair{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot{border:1px solid var(--line);background:var(--surface);overflow:hidden}
.shot img{display:block;width:100%;height:auto}
.dk{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dk{display:block!important}:root:not([data-theme="light"]) .has-dk .lt{display:none!important}}
:root[data-theme="dark"] .dk{display:block!important}:root[data-theme="dark"] .has-dk .lt{display:none!important}
figcaption{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pick{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer}
.pick:hover,.pick:has(input:checked){background:var(--surface)}
.pick input{margin:3px 0 0;accent-color:var(--accent)}
textarea,input[type=text]{width:100%;font:14px/1.5 var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
textarea{resize:vertical;min-height:60px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13px;color:var(--ok)}
pre.out{white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:6px;margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
<header>
<p class="lbl acc">Design exploration · 3 Oct 2026 · after PR #1432</p>
<h1 id="q"></h1>
<blockquote id="quote"></blockquote>
</header>

<nav class="rounds" id="rounds" aria-label="Rounds"></nav>

<section id="today"></section>
<section id="round"></section>

<section id="react">
<div class="shead"><p class="lbl">Your reaction</p><h2 id="reactTitle"></h2><p class="muted">Pick one, or say what's missing. Copy the text and paste it back in the chat.</p></div>
<form id="form"></form>
<div class="row"><button type="button" id="copy" class="primary">Copy reaction</button><span class="status" id="status" role="status" aria-live="polite"></span></div>
<pre class="out" id="preview"></pre>
</section>
</div>

<script>
const IMG=(p,cap,dk)=>({p,cap,dk}); // p: light (or only) capture, dk: optional dark capture
const QUESTION={
 quote:"“the \"Rejoin\" button making the bar change size is awkward, can we explore more options” (Zack, 3 Oct)",
 q:"Where does Rejoin go so that detaching from a shared frame, or rejoining it, never changes the frame bar's width?",
 slug:"rejoin-bar-width"
};
const TODAY={facts:"While you're detached from a shared frame (your own copy, hosted only), Interact gives way to Rejoin: an outline xs text Button, 52px wide where Interact is a 28px icon button (components/canvas/iframe-layer.tsx:1105, frame-driver.tsx:240). Measured from the DOM, the bar grows from 579px to 603.7px (+24.7px) and recentres under the frame, so every control after the address shifts. The title line already says “Detached” (FrameLocalCopyTag), and ⋯ already has Rejoin shared frame. Interact is gone while detached, so a double-click is the only way to use your copy; Zack wants Interact kept. Captures are the local build with the detached state forced and PR #1460's spinner fix applied.",
 shots:[IMG("today/attached-bar.light.webp","Shared frame · 579px","today/attached-bar.dark.webp"),IMG("today/today-bar.light.webp","Detached today · 603.7px","today/today-bar.dark.webp")]};
const ROUNDS=[
{n:2,feedback:"Zack, 3 Oct: “i like detach toggle in the bar actually. can the toggle state be more prominent when detached and default when not”. When shared, every option shows the toggle as a plain ghost icon button like Knobs (first shot below). The bar stays 611px in every state.",options:[
 {id:"A",name:"Ink fill",rec:true,state:"picked",
  why:"Pressed, the toggle takes the solid ink fill that a pressed IconButton already uses (foreground with the background as the icon), which is black in light and white in dark. It's the strongest neutral state the system has, and it stays clear of Interact's pink, so being detached and interacting read as two separate things.",
  cost:"None: it's the stock pressed default variant. Next to pink Interact the bar holds two filled buttons.",
  shots:[IMG("r2/A-bar.light.webp","A · detached · whole bar","r2/A-bar.dark.webp"),IMG("r2/A-zoom.light.webp","A · detached","r2/A-zoom.dark.webp"),IMG("r2/A-interact-zoom.light.webp","A · detached and interacting","r2/A-interact-zoom.dark.webp")]},
 {id:"B",name:"Yellow fill",state:"rejected",
  why:"The Signal yellow (warning) as a solid fill with a black icon, the same pattern as Interact's pink. It's the loudest option, and it reads as “you're off the shared view”.",
  cost:"Yellow means warning elsewhere, and detaching is a choice rather than a problem. With Interact pressed, two neon fills sit side by side.",
  shots:[IMG("r2/B-bar.light.webp","B · detached · whole bar","r2/B-bar.dark.webp"),IMG("r2/B-zoom.light.webp","B · detached","r2/B-zoom.dark.webp"),IMG("r2/B-interact-zoom.light.webp","B · detached and interacting","r2/B-interact-zoom.dark.webp")]},
 {id:"C",name:"Outline",state:"rejected",
  why:"The outline variant: a hairline border around the icon on the bar's surface. It's quieter than a fill, but it's still clearly a state.",
  cost:"A ring, which the restraint rule steers away from, and it's the least prominent of the four, so it may not be enough of a change.",
  shots:[IMG("r2/C-bar.light.webp","C · detached · whole bar","r2/C-bar.dark.webp"),IMG("r2/C-zoom.light.webp","C · detached","r2/C-zoom.dark.webp"),IMG("r2/C-interact-zoom.light.webp","C · detached and interacting","r2/C-interact-zoom.dark.webp")]},
 {id:"D",name:"Yellow ink on the quiet fill",state:"rejected",
  why:"The quiet pressed fill that driver marks use, with the icon in yellow ink. It's in between: the colour signals the state without a block of neon.",
  cost:"Yellow ink is olive in light mode and harder to see at 16px. It's the same warning-hue question as B.",
  shots:[IMG("r2/D-bar.light.webp","D · detached · whole bar","r2/D-bar.dark.webp"),IMG("r2/D-zoom.light.webp","D · detached","r2/D-zoom.dark.webp"),IMG("r2/D-interact-zoom.light.webp","D · detached and interacting","r2/D-interact-zoom.dark.webp")]}
],today:[IMG("r2/shared-zoom.light.webp","Shared · default ghost","r2/shared-zoom.dark.webp")]},
{n:1,feedback:"Zack, 3 Oct: “also rejoin shouldn't hide the interact button?” Interact stays while detached in every option. Then: “maybe rejoin goes where someone controlling pill does? idk … just next to the detached txt”, which is option B.",options:[
 {id:"A",name:"A Detach toggle beside Interact",rec:true,state:"picked",
  why:"Shared frames get one more 28px icon button after Interact: the monitor icon that ⋯ and the Detached tag already use. Click it to detach. While you're detached it stays pressed on the quiet fill, and clicking it again rejoins; its two-line tooltip says “Detached” and then “Click to rejoin the shared frame”. Interact stays and works on your own copy. Because the button is there in both states, entering or leaving detached never changes the bar.",
  cost:"Shared (hosted) frames' bars are 28px wider all the time (611px against 579px). Detach moves out of ⋯ into the bar, and the Mac, which has no shared frames, never shows it.",
  shots:[IMG("r1/A-shared-bar.light.webp","A · shared · 611px","r1/A-shared-bar.dark.webp"),IMG("r1/A-bar.light.webp","A · detached · 611px","r1/A-bar.dark.webp"),IMG("r1/A-tooltip.light.webp","A · hover while detached","r1/A-tooltip.dark.webp")]},
 {id:"B",name:"Rejoin where the “is driving” pill goes",state:"rejected",
  why:"Zack's idea. The title line's right end, where “Agent is driving” sits on a driven frame, holds “Detached” and a Rejoin pill in the driver tag's shape (18px, ink fill, an arrow icon). The state and the way back sit together, can be seen even when the frame isn't selected, and the frame bar never changes: Interact stays and works on your copy. Unlike the small outline button that sat next to Detached before PR #1432 (which Zack didn't love), this one takes the driver tag's filled pill shape and its spot, right-aligned to the frame's edge.",
  cost:"The title line gets its first button, and the pill is a small target at 18px. Rejoin leaves the bar, where control lives. A detached frame and a driven frame share one slot, which is fine because detaching lets go of control.",
  shots:[IMG("r1/B2-bar.light.webp","B · detached · 579px, bar as when shared","r1/B2-bar.dark.webp"),IMG("r1/B2-title.light.webp","B · title line close-up","r1/B2-title.dark.webp"),IMG("r1/B2-frame.light.webp","B · whole frame","r1/B2-frame.dark.webp")]},
 {id:"C",name:"Interact stays, Rejoin only in ⋯",state:"rejected",
  why:"No new UI. The bar keeps Interact for your copy, the title line says Detached, and Rejoin shared frame stays where Detach from shared frame lives, in ⋯, so the way out and the way back sit in the same menu.",
  cost:"Rejoin is two clicks away and easy to miss. The Detached tag is the only cue that you're on your own copy.",
  shots:[IMG("r1/C-bar.light.webp","C · detached · 579px, bar as when shared","r1/C-bar.dark.webp"),IMG("r1/C-menu.light.webp","C · ⋯ menu","r1/C-menu.dark.webp")]}
]}
];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const shots=list=>list&&list.length?`<div class="shots">`+list.map(i=>`<figure><div class="shot${i.dk?" has-dk":""}"><img class="lt" src="${i.p}" alt="${esc(i.cap)}" loading="lazy">${i.dk?`<img class="dk" src="${i.dk}" alt="" aria-hidden="true" loading="lazy">`:""}</div><figcaption>${esc(i.cap)}</figcaption></figure>`).join("")+`</div>`:"";
const KEY="exploration-"+QUESTION.slug;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let current=ROUNDS[0].n;

$("q").textContent=QUESTION.q;$("quote").textContent=QUESTION.quote;
$("today").innerHTML=`<div class="shead"><p class="lbl">Today</p><h2>What main does now</h2><p class="muted">${esc(TODAY.facts)}</p></div>`+shots(TODAY.shots);
$("rounds").innerHTML=`<span class="lbl">Round</span>`+ROUNDS.map(r=>`<button type="button" data-n="${r.n}">${r.n}${r===ROUNDS[0]?" · latest":""}</button>`).join("");
$("rounds").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(b){current=+b.dataset.n;render()}});

function render(){
 const r=ROUNDS.find(x=>x.n===current),latest=r===ROUNDS[0];
 $("rounds").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===current)));
 $("round").innerHTML=`<div class="shead"><p class="lbl">Round ${r.n}</p><h2>${r.options.length} options</h2>${r.feedback?`<blockquote>${esc(r.feedback)}</blockquote>`:""}${r.today?shots(r.today):""}</div><div class="opts">`+
  r.options.map(o=>`<article class="opt ${o.state}" id="r${r.n}-${o.id}"><header><span class="letter">${o.id}</span><h3>${esc(o.name)}</h3>${o.rec?'<span class="badge rec">Recommended</span>':""}${o.state?`<span class="badge ${o.state}">${o.state==="picked"?"Picked":"Rejected"}</span>`:""}</header>${shots(o.shots)}<p>${esc(o.why)}</p><p class="cost"><b>Cost</b> ${esc(o.cost)}</p></article>`).join("")+`</div>`;
 $("react").hidden=!latest;
 if(latest)renderForm(r);
}
function renderForm(r){
 $("reactTitle").textContent=`Round ${r.n}`;
 const opts=r.options.map(o=>[o.id,`${o.id}: ${o.name}${o.rec?" (recommended)":""}`]).concat([["none","None of these"],["mix","A mix (say which parts below)"]]);
 $("form").innerHTML=`<fieldset><legend>Pick</legend>`+opts.map(([v,l])=>`<label class="pick"><input type="radio" name="pick" id="pick-${v}" value="${v}"><span>${esc(l)}</span></label>`).join("")+`</fieldset>`+
  `<p class="lbl" style="margin-top:12px">Notes</p><textarea id="note" aria-label="Notes"></textarea>`;
 if(saved.round===r.n){const el=$("pick-"+saved.pick);if(el)el.checked=true;$("note").value=saved.note||""}
 preview();
}
function build(){
 const r=ROUNDS[0],p=$("form").querySelector("input[name=pick]:checked"),note=$("note").value.trim();
 const o=p&&r.options.find(x=>x.id===p.value);
 const pick=!p?"No pick yet":o?`${o.id}: ${o.name}`:p.value==="none"?"None of these":"A mix";
 return[`Exploration: ${QUESTION.q}`,`Round ${r.n}`,`→ ${pick}`].concat(note?[`Note: ${note}`]:[]).join("\n");
}
function preview(){
 $("preview").textContent=build();
 const p=$("form").querySelector("input[name=pick]:checked");
 try{localStorage.setItem(KEY,JSON.stringify({round:ROUNDS[0].n,pick:p?p.value:"",note:$("note").value}))}catch(e){}
}
$("form").addEventListener("input",preview);
$("form").addEventListener("submit",e=>e.preventDefault());
$("copy").addEventListener("click",()=>{
 const text=build(),st=$("status");
 const fallback=()=>{const p=$("preview"),r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);st.textContent="Copy was blocked. The text is selected; copy it by hand."};
 try{navigator.clipboard.writeText(text).then(()=>{st.textContent="Copied. Paste it in the chat."},fallback)}catch(e){fallback()}
});
render();
</script>

</body></html>
